# DVL Scanner backend — reverse-proxy snippet.
# Paste these two location blocks inside the existing `server { ... }`
# block for depthvisionlab.com (the same file that already has /mexc-proxy/).
# Then: nginx -t && systemctl reload nginx

# REST snapshot (and health)
location /api/dvl/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}

# WebSocket live feed (note the Upgrade headers)
location /ws/dvl/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;   # keep long-lived sockets open
    proxy_send_timeout 3600s;
}
