function svgEl(tag, attrs={}){
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, String(v)));
  return el;
}

const priceScale = { min:66200, max:68200, h:602, w:756 };
function priceToY(price){ return (priceScale.max - price) / (priceScale.max - priceScale.min) * priceScale.h; }
function yPctOnPlot(price){ return priceToY(price) / priceScale.h * 100; }

function fmtPriceBR(value, decimals=1){
  const n = Number(value).toFixed(decimals).replace('.', ',');
  return n.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function addTradeLine({id, price, color, dashed=false, tagText, tagLeft=28, scaleText, current=false}){

  line.id = id + "Line";
  line.className = `trade-line ${color} ${dashed ? 'dashed' : ''}`;
  line.style.top = `calc(var(--plot-y) * var(--px) + ${y}% * var(--plot-h) / 100)`;
  lines.appendChild(line);

  const tag = document.createElement("div");
  tag.id = id + "Tag";
  tag.className = `plot-tag ${color}`;
  tag.textContent = tagText;
  tag.style.left = `calc(${tagLeft} * var(--px))`;
  tag.style.top = `calc(var(--plot-y) * var(--px) + ${y}% * var(--plot-h) / 100 - 21 * var(--px))`;
  lines.appendChild(tag);

  const scale = document.createElement("div");
  scale.id = id + "Scale";
  scale.className = current ? "price-pill green" : `price-pill outline-${color}`;
  scale.innerHTML = current ? `${scaleText}<small>02:34</small>` : scaleText;
  scale.style.top = `${y}%`;
  $("dvlPriceScale").appendChild(scale);
}

function makeCandleData(){
  const closes = [66920,67050,67110,67020,67140,67310,67420,67350,67280,67220,67170,67260,67130,67080,67020,66980,67110,67040,66860,66760,66650,66590,66480,66610,66690,66830,66940,67020,66980,66920,66840,66760,66650,66720,66780,66840,66950,67080,67210,67318];
  let prev = 66860;
  return closes.map((close, i)=>{
    const open = prev + Math.sin(i*1.7)*35;
    const high = Math.max(open, close) + 35 + (i%7===0?95:0) + (i===6?190:0);
    const low = Math.min(open, close) - 35 - (i%9===0?80:0) - (i===23?110:0);
    const vol = 30 + Math.abs(close-open)*.42 + (i%6)*7 + (i>34?35:0);
    prev = close;
    return {open,high,low,close,vol};
  });
}

function renderCandles(){
  const data = makeCandleData();
  const svg = $("dvlChartSvg");
  const volSvg = $("dvlVolumeSvg");
  svg.innerHTML = ""; volSvg.innerHTML = "";
  const n = data.length;
  const startX = 8;
  const gap = 18.2;
  const bodyW = 7.6;
  data.forEach((c,i)=>{
    const x = startX + i*gap;
    const up = c.close >= c.open;
    const color = up ? "#10df77" : "#ff3037";
    const wick = svgEl("line", {x1:x+bodyW/2, x2:x+bodyW/2, y1:priceToY(c.high), y2:priceToY(c.low), stroke:color, "stroke-width":1.8, "stroke-linecap":"round"});
    const y1 = priceToY(Math.max(c.open,c.close));
    const y2 = priceToY(Math.min(c.open,c.close));
    const rect = svgEl("rect", {x, y:y1, width:bodyW, height:Math.max(2,y2-y1), rx:.7, fill:color, opacity:.95});
    svg.appendChild(wick); svg.appendChild(rect);
    const vh = Math.max(8, Math.min(120, c.vol));
    const vb = svgEl("rect", {x, y:132-vh, width:bodyW+1, height:vh, fill: up ? "rgba(16,223,119,.50)" : "rgba(255,48,55,.46)"});
    volSvg.appendChild(vb);
  });
}

  const w = 748, h = 125;
  const y = v => (80-v)/(80-20)*h;
  const pts = vals.map((v,i)=>`${(i/(vals.length-1))*w},${y(v)}`).join(" ");

}

function renderMACD(){
  const svg = $("dvlMACDSvg"); svg.innerHTML = "";
  const hist = [-30,-22,-12,4,18,31,44,36,26,12,-6,-18,-30,-39,-44,-42,-35,-24,-12,2,18,34,49,61,70,76,65,50,34,18,5,-8,-18,-13,2,20,38,55,68,76];
  const signal = [-10,0,18,35,52,70,86,92,86,72,54,33,10,-12,-35,-58,-78,-96,-105,-98,-82,-60,-35,-10,15,38,54,62,55,40,22,8,2,6,18,35,54,70,82,96];
  const macd = [-22,-6,15,42,70,96,112,104,88,62,34,8,-20,-50,-78,-108,-132,-145,-130,-104,-70,-32,8,46,76,95,108,96,72,42,10,-14,-24,-14,6,34,62,90,120,150];
  const w=748,h=125, zero=h*.58;
  const y = v => zero - (v/200)*h*.50;
  const barW = 10.5, gap=7.8;
  hist.forEach((v,i)=>{
    const x = i*(barW+gap);
    const yy = v>=0 ? y(v) : zero;
    const hh = Math.abs(y(v)-zero);
    svg.appendChild(svgEl("rect", {x, y:yy, width:barW, height:Math.max(2,hh), fill:v>=0?"rgba(16,223,119,.68)":"rgba(255,48,55,.72)"}));
  });
  const line = arr => arr.map((v,i)=>`${i/(arr.length-1)*w},${y(v)}`).join(" ");
  svg.appendChild(svgEl("polyline", {points:line(macd), fill:"none", stroke:"#10df77", "stroke-width":2.4, "stroke-linecap":"round", "stroke-linejoin":"round"}));
  svg.appendChild(svgEl("polyline", {points:line(signal), fill:"none", stroke:"#ff3037", "stroke-width":2.0, "stroke-linecap":"round", "stroke-linejoin":"round"}));
}


function wireTimeframeScroller(){
  const wrap = $("tfMoreWrap");
  const btn = $("tfMoreBtn");
  const menu = $("tfMoreMenu");
  const list = $("tfMoreList");
  if(!wrap || !btn) return;

  const timeframes = ["1s","5s","15s","30s","1m","3m","5m","15m","30m","1H","2H","4H","1D"];
  let index = Math.max(0, timeframes.indexOf("5m"));
  let startY = null;
  let lastY = null;
  let accum = 0;
  let didDrag = false;
  let rafClear = null;

  const currentLabel = () => btn.querySelector(".tf-current") || btn.querySelector("span:first-child");
  const prevLabel = () => btn.querySelector(".tf-prev");
  const nextLabel = () => btn.querySelector(".tf-next");

  function getPrevIndex(){ return (index - 1 + timeframes.length) % timeframes.length; }
  function getNextIndex(){ return (index + 1) % timeframes.length; }

  function renderWheel(){
    const tf = timeframes[index];
    const c = currentLabel();
    const p = prevLabel();
    const n = nextLabel();
    if(c) c.textContent = tf;
    if(p) p.textContent = timeframes[getPrevIndex()];
    if(n) n.textContent = timeframes[getNextIndex()];
    btn.dataset.timeframe = tf;
    wrap.dataset.timeframe = tf;
    btn.setAttribute("aria-label", `Timeframe ${tf}. Arraste para trocar ou toque no centro para escolher.`);
  }

  function renderManualList(){
    if(!list) return;
    list.innerHTML = "";
    timeframes.forEach((tf, i) => {
      const opt = document.createElement("button");
      opt.type = "button";
      opt.className = "tf-option" + (i === index ? " active" : "");
      opt.textContent = tf;
      opt.dataset.timeframe = tf;
      opt.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        applyTimeframe(i, i > index ? "up" : "down", "manual-selector");
        closeManualSelector();
        showToast(`TF ${tf}`);
      });
      list.appendChild(opt);
    });
    const small = menu?.querySelector(".tfMoreHead small");
    if(small) small.textContent = timeframes[index];
  }

  function openManualSelector(){
    renderManualList();
    wrap.classList.add("is-tf-menu-open");
    menu?.setAttribute("aria-hidden", "false");
  }

  function closeManualSelector(){
    wrap.classList.remove("is-tf-menu-open");
    menu?.setAttribute("aria-hidden", "true");
  }

  function toggleManualSelector(){
    if(wrap.classList.contains("is-tf-menu-open")) closeManualSelector();
    else openManualSelector();
  }

  function applyTimeframe(nextIndex, direction="up", source="timeframe-wheel"){
    index = (nextIndex + timeframes.length) % timeframes.length;
    const tf = timeframes[index];
    renderWheel();
    renderManualList();
    window.DVL_SELECTED_TIMEFRAME = tf;

    btn.classList.remove("tf-snap-up","tf-snap-down");
    void btn.offsetWidth;
    btn.classList.add(direction === "down" ? "tf-snap-down" : "tf-snap-up");
    clearTimeout(rafClear);
    rafClear = setTimeout(()=>btn.classList.remove("tf-snap-up","tf-snap-down"), 180);

    wrap.dispatchEvent(new CustomEvent("dvl:timeframe-change", {
      bubbles:true,
      detail:{ timeframe:tf, index, source }
    }));
  }

  function step(dir, source="scroll"){
    closeManualSelector();
    wrap.classList.add("is-tf-scrolling");
    applyTimeframe(index + dir, dir > 0 ? "up" : "down", source);
    clearTimeout(wrap._tfScrollTimer);
    wrap._tfScrollTimer = setTimeout(()=>wrap.classList.remove("is-tf-scrolling"), 420);
  }

  wrap.addEventListener("wheel", (ev)=>{
    ev.preventDefault();
    if(Math.abs(ev.deltaY) < 2) return;
    accum += ev.deltaY;
    if(Math.abs(accum) >= 22){
      step(accum > 0 ? 1 : -1, "wheel");
      accum = 0;
    }
  }, {passive:false});

  wrap.addEventListener("pointerdown", (ev)=>{
    startY = ev.clientY;
    lastY = ev.clientY;
    accum = 0;
    didDrag = false;
    wrap.setPointerCapture?.(ev.pointerId);
    wrap.classList.add("is-tf-scrolling");
  });

  wrap.addEventListener("pointermove", (ev)=>{
    if(startY === null) return;
    const dy = ev.clientY - lastY;
    lastY = ev.clientY;
    accum += dy;
    if(Math.abs(ev.clientY - startY) > 4) didDrag = true;
    if(Math.abs(accum) >= 18){
      step(accum > 0 ? 1 : -1, "vertical-swipe");
      accum = 0;
      didDrag = true;
    }
  });

  const end = (ev)=>{
    if(startY === null) return;
    wrap.releasePointerCapture?.(ev.pointerId);
    startY = null;
    lastY = null;
    accum = 0;
    clearTimeout(wrap._tfScrollTimer);
    wrap._tfScrollTimer = setTimeout(()=>wrap.classList.remove("is-tf-scrolling"), 160);
  };
  wrap.addEventListener("pointerup", end);
  wrap.addEventListener("pointercancel", end);

  btn.addEventListener("click", (ev)=>{
    ev.preventDefault();
    ev.stopImmediatePropagation();

    if(didDrag){
      didDrag = false;
      return;
    }

    const rect = btn.getBoundingClientRect();
    const y = ev.clientY - rect.top;
    if(y < rect.height * 0.34){
      step(-1, "tap-prev-visible");
      showToast(`TF ${timeframes[index]}`);
      return;
    }
    if(y > rect.height * 0.66){
      step(1, "tap-next-visible");
      showToast(`TF ${timeframes[index]}`);
      return;
    }
    toggleManualSelector();
  });

  document.addEventListener("click", (ev)=>{
    if(!wrap.contains(ev.target)) closeManualSelector();
  }, true);

  renderWheel();
  renderManualList();
}

<script id="DVL_BINANCE_PUBLIC_API_0714">
/*
  DVL Beta 0.728 — Binance public API bridge.
  Scope: market data only. No API key. No trading permissions.
  REST: fapi klines. WS: futures kline stream.
*/
(function(){
  "use strict";

  const $ = (id) => document.getElementById(id);
  const safeToast = (msg) => {
    if(typeof window.showToast === "function") window.showToast(msg);
    else console.log("[DVL]", msg);
  };

  const REST = "https://fapi.binance.com";
  const WS_BASE = "wss://fstream.binance.com/ws";
  const DEFAULT_SYMBOL = "BTCUSDT";
  const SYMBOLS = [
    ["BTCUSDT","BTC/USDT","Bitcoin"],
    ["ETHUSDT","ETH/USDT","Ethereum"],
    ["SOLUSDT","SOL/USDT","Solana"],
    ["BNBUSDT","BNB/USDT","BNB"],
    ["XRPUSDT","XRP/USDT","XRP"],
    ["DOGEUSDT","DOGE/USDT","Dogecoin"],
    ["ADAUSDT","ADA/USDT","Cardano"]
  ];

  const TF_TO_BINANCE = {
    "1s":"1m", "5s":"1m", "15s":"1m", "30s":"1m",
    "1m":"1m", "3m":"3m", "5m":"5m", "15m":"15m", "30m":"30m",
    "1H":"1h", "2H":"2h", "4H":"4h", "1D":"1d"
  };

  const api = window.DVL_API = {
    version:"0.728",
    connected:false,
    source:"Binance USD-M Futures public market data",
    symbol:readStore("DVL_API_SYMBOL") || DEFAULT_SYMBOL,
    interval:"5m",
    candles:[],
    ws:null,
    reconnectTimer:null,
    loading:false,
    lastError:null
  };

  function readStore(key){
    try { return localStorage.getItem(key); } catch(e) { return null; }
  }
  function writeStore(key,value){
    try { localStorage.setItem(key,value); } catch(e) {}
  }

  function displaySymbol(symbol){
    const found = SYMBOLS.find(s => s[0] === symbol);
    if(found) return found[1];
    if(symbol.endsWith("USDT")) return symbol.replace("USDT","/USDT");
    return symbol;
  }

  function normalizeTf(tf){
    return TF_TO_BINANCE[tf] || "5m";
  }

  function selectedTf(){
    return window.DVL_SELECTED_TIMEFRAME || $("tfMoreBtn")?.dataset?.timeframe || "5m";
  }

  function fmtBR(value, decimals=1){
    const num = Number(value);
    if(!Number.isFinite(num)) return "--";
    return num.toLocaleString("pt-BR", {
      minimumFractionDigits:decimals,
      maximumFractionDigits:decimals
    });
  }

  function fmtCompact(value){
    const n = Number(value);
    if(!Number.isFinite(n)) return "--";
    return n.toLocaleString("pt-BR", { maximumFractionDigits:1 });
  }

  function klineFromRest(k){
    return {
      t:Number(k[0]),
      open:Number(k[1]),
      high:Number(k[2]),
      low:Number(k[3]),
      close:Number(k[4]),
      volume:Number(k[5]),
      closed:true
    };
  }

  function klineFromWs(k){
    return {
      t:Number(k.t),
      open:Number(k.o),
      high:Number(k.h),
      low:Number(k.l),
      close:Number(k.c),
      volume:Number(k.v),
      closed:!!k.x
    };
  }

  function dispatch(name, detail={}){
    document.dispatchEvent(new CustomEvent(name, { bubbles:true, detail }));
  }

  function updateHeader(){
    const symText = $("symbolText");
    if(symText) symText.textContent = displaySymbol(api.symbol);
  }

  function rangeFromCandles(candles){
    let min = Infinity, max = -Infinity;
    candles.forEach(c => {
      if(c.low < min) min = c.low;
      if(c.high > max) max = c.high;
    });
    if(!Number.isFinite(min) || !Number.isFinite(max) || min === max){
      min = 66000; max = 68000;
    }
    const pad = Math.max((max-min)*0.16, max*0.0015);
    return { min:min-pad, max:max+pad };
  }

  function yFor(price, range, height){
    return (range.max - price) / (range.max - range.min) * height;
  }

  function svgEl(tag, attrs={}){
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,String(v)));
    return el;
  }

  function setOHLC(candles){
    const ohlc = $("dvlOHLC");
    if(!ohlc || !candles.length) return;
    const last = candles[candles.length - 1];
    const prev = candles[candles.length - 2] || last;
    const diff = last.close - prev.close;
    const pct = prev.close ? diff / prev.close * 100 : 0;
    const sign = diff >= 0 ? "+" : "";
    const cls = diff >= 0 ? "ohlc-green" : "";
    ohlc.innerHTML = `
      <span><b class="ohlc-label">O</b>${fmtBR(last.open,1)}</span>
      <span><b class="ohlc-label">H</b>${fmtBR(last.high,1)}</span>
      <span><b class="ohlc-label">L</b>${fmtBR(last.low,1)}</span>
      <span><b class="ohlc-label">C</b><b class="${cls}">${fmtBR(last.close,1)}</b></span>
      <span class="${cls}">${sign}${fmtBR(diff,1)} (${sign}${fmtBR(pct,2)}%)</span>
    `;
  }

  function setTimeScale(candles){
    const box = $("dvlTimeScale");
    if(!box || candles.length < 2) return;
    const indices = [0,.25,.5,.75,1].map(p => Math.round((candles.length-1)*p));
    const fmt = new Intl.DateTimeFormat("pt-BR", { hour:"2-digit", minute:"2-digit" });
    box.innerHTML = indices.map(i => `<span>${fmt.format(new Date(candles[i].t))}</span>`).join("");
  }

  function renderPriceScale(candles, range){
    const scale = $("dvlPriceScale");
    const lines = $("dvlTradeLines");
    if(!scale || !lines || !candles.length) return;

    scale.innerHTML = "";
    lines.innerHTML = "";

    const steps = 10;
    for(let i=0;i<=steps;i++){
      const price = range.max - (range.max-range.min) * (i/steps);
      const s = document.createElement("span");
      s.className = "scale-label";
      s.textContent = fmtBR(price,1);
      s.style.top = `${(i/steps)*100}%`;
      scale.appendChild(s);
    }

    const current = candles[candles.length - 1].close;
    const tp = current * 1.0098;
    const sl = current * 0.9841;

    addLine("tp", tp, "green", true, `TP   ${fmtBR(tp,1)}`, fmtBR(tp,1), range);
    addLine("current", current, "green", true, "", fmtBR(current,1), range, true);
    addLine("sl", sl, "red", true, `SL   ${fmtBR(sl,1)}`, fmtBR(sl,1), range);
  }

  function addLine(id, price, color, dashed, tagText, scaleText, range, current=false){
    const lines = $("dvlTradeLines");
    const scale = $("dvlPriceScale");
    const y = (yFor(price, range, 602) / 602) * 100;

    const line = document.createElement("div");
    line.id = id + "Line";
    line.className = `trade-line ${color} ${dashed ? "dashed" : ""}`;
    line.style.top = `calc(var(--plot-y) * var(--px) + ${y}% * var(--plot-h) / 100)`;
    lines.appendChild(line);

    if(tagText){
      const tag = document.createElement("div");
      tag.id = id + "Tag";
      tag.className = `plot-tag ${color}`;
      tag.textContent = tagText;
      tag.style.left = `calc(28 * var(--px))`;
      tag.style.top = `calc(var(--plot-y) * var(--px) + ${y}% * var(--plot-h) / 100 - 21 * var(--px))`;
      lines.appendChild(tag);
    }

    const pill = document.createElement("div");
    pill.id = id + "Scale";
    pill.className = current ? "price-pill green" : `price-pill outline-${color}`;
    pill.innerHTML = current ? `${scaleText}<small>${new Intl.DateTimeFormat("pt-BR",{hour:"2-digit",minute:"2-digit"}).format(new Date())}</small>` : scaleText;
    pill.style.top = `${y}%`;
    scale.appendChild(pill);
  }

  function renderCandles(candles, range){
    const svg = $("dvlChartSvg");
    const volSvg = $("dvlVolumeSvg");
    if(!svg || !volSvg || !candles.length) return;

    svg.innerHTML = "";
    volSvg.innerHTML = "";

    const data = candles.slice(-58);
    const n = data.length;
    const step = 756 / Math.max(n,1);
    const bodyW = Math.max(4, Math.min(9, step * .54));
    const maxVol = Math.max(...data.map(c=>c.volume), 1);

    data.forEach((c,i)=>{
      const x = i * step + Math.max(1, (step-bodyW)/2);
      const up = c.close >= c.open;
      const color = up ? "#10df77" : "#ff3037";
      const wickX = x + bodyW/2;
      const yHigh = yFor(c.high, range, 602);
      const yLow = yFor(c.low, range, 602);
      const yOpen = yFor(c.open, range, 602);
      const yClose = yFor(c.close, range, 602);
      svg.appendChild(svgEl("line", {
        x1:wickX, x2:wickX, y1:yHigh, y2:yLow,
        stroke:color, "stroke-width":1.75, "stroke-linecap":"round"
      }));
      svg.appendChild(svgEl("rect", {
        x, y:Math.min(yOpen,yClose), width:bodyW,
        height:Math.max(2, Math.abs(yClose-yOpen)),
        rx:.7, fill:color, opacity:.96
      }));

      const vh = Math.max(5, (c.volume / maxVol) * 118);
      volSvg.appendChild(svgEl("rect", {
        x, y:132-vh, width:bodyW+1, height:vh,
        fill:up ? "rgba(16,223,119,.50)" : "rgba(255,48,55,.46)"
      }));
    });
  }

  function ema(values, period){
    const k = 2/(period+1);
    const out = [];
    let prev = values[0] || 0;
    values.forEach((v,i)=>{
      prev = i === 0 ? v : v*k + prev*(1-k);
      out.push(prev);
    });
    return out;
  }

  function calcRSI(closes, period=14){
    if(closes.length < period+1) return closes.map(()=>50);
    let gains=0, losses=0;
    for(let i=1;i<=period;i++){
      const d = closes[i] - closes[i-1];
      if(d>=0) gains += d; else losses -= d;
    }
    let avgGain = gains/period;
    let avgLoss = losses/period;
    const out = Array(period).fill(50);
    out.push(avgLoss === 0 ? 100 : 100 - 100/(1 + avgGain/avgLoss));
    for(let i=period+1;i<closes.length;i++){
      const d = closes[i] - closes[i-1];
      avgGain = (avgGain*(period-1) + Math.max(d,0))/period;
      avgLoss = (avgLoss*(period-1) + Math.max(-d,0))/period;
      out.push(avgLoss === 0 ? 100 : 100 - 100/(1 + avgGain/avgLoss));
    }
    return out;
  }

  function renderRSI(candles){
    const svg = $("dvlRSISvg");
    const title = document.querySelector("#dvlRSISection .osc-title .value");
    if(!svg || !candles.length) return;
    const closes = candles.map(c=>c.close);
    const vals = calcRSI(closes).slice(-56);
    const last = vals[vals.length-1] || 50;
    if(title) title.textContent = fmtBR(last,2);
    svg.innerHTML = "";
    const w=748, h=125;
    const y = v => (80-v)/(80-20)*h;
    const pts = vals.map((v,i)=>`${(i/Math.max(vals.length-1,1))*w},${y(Math.max(20,Math.min(80,v)))}`).join(" ");
    svg.appendChild(svgEl("polyline", {points:pts, fill:"none", stroke:"#10df77", "stroke-width":2.2, "stroke-linejoin":"round", "stroke-linecap":"round"}));

    const scale = $("dvlRSIScale");
    if(scale){
      const pill = scale.querySelector(".price-pill, .osc-pill");
      let p = pill;
      if(!p){
        p = document.createElement("span");
        p.className = "osc-pill";
        scale.appendChild(p);
      }
      p.textContent = fmtBR(last,2);
      p.style.top = `${Math.max(0,Math.min(100, (80-last)/(80-20)*100))}%`;
    }
  }

  function renderMACD(candles){
    const svg = $("dvlMACDSvg");
    if(!svg || !candles.length) return;
    const closes = candles.map(c=>c.close);
    const ema12 = ema(closes,12);
    const ema26 = ema(closes,26);
    const macd = closes.map((_,i)=>ema12[i]-ema26[i]);
    const signal = ema(macd,9);
    const hist = macd.map((m,i)=>m-signal[i]);
    const dataM = macd.slice(-56), dataS = signal.slice(-56), dataH = hist.slice(-56);

    const lastM = dataM[dataM.length-1] || 0;
    const lastS = dataS[dataS.length-1] || 0;
    const lastH = dataH[dataH.length-1] || 0;
    const title = document.querySelector("#dvlMACDSection .osc-title");
    if(title){
      title.innerHTML = `<span>MACD (12, 26, close)</span> <span class="value">${fmtBR(lastM,1)}</span> <span class="value red">${fmtBR(lastS,1)}</span> <span class="value yellow">${fmtBR(lastH,1)}</span>`;
    }

    svg.innerHTML = "";
    const w=748,h=125, zero=h*.58;
    const maxAbs = Math.max(1, ...dataM.map(Math.abs), ...dataS.map(Math.abs), ...dataH.map(Math.abs));
    const y = v => zero - (v/maxAbs)*h*.46;
    const barStep = w / Math.max(dataH.length,1);
    const barW = Math.max(3, Math.min(10, barStep*.58));
    dataH.forEach((v,i)=>{
      const x=i*barStep + (barStep-barW)/2;
      const yy = v>=0 ? y(v) : zero;
      const hh = Math.max(2, Math.abs(y(v)-zero));
      svg.appendChild(svgEl("rect", {x, y:yy, width:barW, height:hh, fill:v>=0?"rgba(16,223,119,.68)":"rgba(255,48,55,.72)"}));
    });
    const line = arr => arr.map((v,i)=>`${i/Math.max(arr.length-1,1)*w},${y(v)}`).join(" ");
    svg.appendChild(svgEl("polyline", {points:line(dataM), fill:"none", stroke:"#10df77", "stroke-width":2.4, "stroke-linecap":"round", "stroke-linejoin":"round"}));
    svg.appendChild(svgEl("polyline", {points:line(dataS), fill:"none", stroke:"#ff3037", "stroke-width":2.0, "stroke-linecap":"round", "stroke-linejoin":"round"}));

    const scale = $("dvlMACDScale");
    if(scale){
      const pills = Array.from(scale.querySelectorAll(".macd-pill"));
      const vals = [lastM,lastS,lastH];
      pills.forEach((p,i)=>p.textContent = fmtBR(vals[i] || 0,1));
    }
  }

  function renderLive(){
    if(!api.candles.length) return;
    const candles = api.candles.slice(-90);
    const range = rangeFromCandles(candles.slice(-58));
    updateHeader();
    setOHLC(candles);
    setTimeScale(candles.slice(-58));
    renderPriceScale(candles, range);
    renderCandles(candles, range);
    renderRSI(candles);
    renderMACD(candles);
    dispatch("dvl:market-render", { symbol:api.symbol, interval:api.interval, candles:api.candles.length });
  }

  async function loadKlines({silent=false}={}){
    api.loading = true;
    api.lastError = null;
    const tf = selectedTf();
    api.interval = normalizeTf(tf);
    const url = `${REST}/fapi/v1/klines?symbol=${encodeURIComponent(api.symbol)}&interval=${encodeURIComponent(api.interval)}&limit=90`;

    try{
      const res = await fetch(url, { cache:"no-store" });
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.json();
      api.candles = raw.map(klineFromRest);
      api.connected = true;
      api.loading = false;
      renderLive();
      connectWs();
      if(!silent) safeToast(`${displaySymbol(api.symbol)} live`);
      dispatch("dvl:api-connected", { symbol:api.symbol, interval:api.interval, public:true });
    }catch(err){
      api.connected = false;
      api.loading = false;
      api.lastError = String(err && err.message || err);
      console.warn("[DVL API] REST failed, keeping demo chart:", err);
      if(!silent) safeToast("API indisponível, mantendo demo");
      dispatch("dvl:api-error", { phase:"rest", error:api.lastError });
    }
  }

  function connectWs(){
    if(api.ws){
      try{ api.ws.close(); }catch(e){}
      api.ws = null;
    }
    clearTimeout(api.reconnectTimer);
    const stream = `${api.symbol.toLowerCase()}@kline_${api.interval}`;
    try{
      api.ws = new WebSocket(`${WS_BASE}/${stream}`);
      api.ws.onopen = () => {
        api.connected = true;
        dispatch("dvl:ws-open", { symbol:api.symbol, interval:api.interval });
      };
      api.ws.onmessage = (ev) => {
        try{
          const msg = JSON.parse(ev.data);
          if(!msg.k) return;
          const next = klineFromWs(msg.k);
          const arr = api.candles;
          if(!arr.length || arr[arr.length-1].t !== next.t) arr.push(next);
          else arr[arr.length-1] = next;
          if(arr.length > 140) arr.splice(0, arr.length - 140);
          renderLive();
          dispatch("dvl:ws-kline", { symbol:api.symbol, interval:api.interval, candle:next });
        }catch(e){
          console.warn("[DVL API] WS parse failed:", e);
        }
      };
      api.ws.onerror = () => {
        dispatch("dvl:api-error", { phase:"ws", error:"websocket" });
      };
      api.ws.onclose = () => {
        api.connected = false;
        clearTimeout(api.reconnectTimer);
        api.reconnectTimer = setTimeout(() => connectWs(), 4500);
      };
    }catch(err){
      api.connected = false;
      api.lastError = String(err && err.message || err);
      dispatch("dvl:api-error", { phase:"ws-open", error:api.lastError });
    }
  }

  function buildSymbolMenu(){
    let menu = document.getElementById("dvlApiSymbolMenu");
    if(!menu){
      menu = document.createElement("div");
      menu.id = "dvlApiSymbolMenu";
      menu.className = "dvl-api-symbol-menu";
      menu.hidden = true;
      document.body.appendChild(menu);
      menu.addEventListener("click", ev => ev.stopPropagation());
    }
    menu.innerHTML = `
      <div class="dvl-api-menu-title"><span>Ativo</span><small>Binance Futures</small></div>
      ${SYMBOLS.map(([sym,display,name]) => `
        <button type="button" class="dvl-api-menu-row ${sym===api.symbol?'is-active':''}" data-symbol="${sym}">
          <span>${display}</span><small>${name}</small>
        </button>`).join("")}
    `;
    menu.querySelectorAll("[data-symbol]").forEach(btn => {
      btn.onclick = () => {
        setSymbol(btn.dataset.symbol);
        menu.hidden = true;
      };
    });
    return menu;
  }

  function positionSymbolMenu(menu){
    const anchor = $("symbolBtn");
    const r = anchor.getBoundingClientRect();
    const w = Math.min(260, window.innerWidth - 22);
    let left = r.left;
    if(left + w > window.innerWidth - 10) left = window.innerWidth - w - 10;
    if(left < 10) left = 10;
    menu.style.left = `${left}px`;
    menu.style.top = `${r.bottom + 8}px`;
    menu.style.width = `${w}px`;
  }

  function toggleSymbolMenu(){
    const menu = buildSymbolMenu();
    const open = menu.hidden;
    menu.hidden = !open;
    if(open) requestAnimationFrame(()=>positionSymbolMenu(menu));
  }

  function setSymbol(symbol){
    api.symbol = symbol;
    writeStore("DVL_API_SYMBOL", symbol);
    updateHeader();
    dispatch("dvl:symbol-change", { symbol, display:displaySymbol(symbol), source:"binance-api-menu" });
    loadKlines();
  }

  function wireApiControls(){
    const symbolBtn = $("symbolBtn");
    if(symbolBtn){
      symbolBtn.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopImmediatePropagation();
        toggleSymbolMenu();
      }, true);
    }

    const fav = $("currentFavoriteBtn");
    if(fav){
      const key = `DVL_FAVORITE_${api.symbol}`;
      fav.classList.toggle("is-favorite", readStore(key) === "1");
      fav.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopImmediatePropagation();
        const k = `DVL_FAVORITE_${api.symbol}`;
        const on = readStore(k) !== "1";
        writeStore(k, on ? "1" : "0");
        fav.classList.toggle("is-favorite", on);
        dispatch("dvl:favorite-change", { symbol:api.symbol, favorite:on });
        safeToast(on ? "Favoritado" : "Removido dos favoritos");
      }, true);
    }

    const save = $("profileSaveBtn");
    if(save){
      save.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopImmediatePropagation();
        const profile = {
          version:window.DVL_APP_VERSION || "0.728",
          symbol:api.symbol,
          interval:api.interval,
          timeframe:selectedTf(),
          api:"binance-public",
          savedAt:new Date().toISOString()
        };
        writeStore("DVL_PROFILE_MAIN", JSON.stringify(profile));
        save.classList.add("saved-pulse");
        setTimeout(()=>save.classList.remove("saved-pulse"), 500);
        dispatch("dvl:profile-save", profile);
        safeToast("Perfil salvo");
      }, true);
    }

    document.addEventListener("dvl:timeframe-change", (ev) => {
      api.interval = normalizeTf(ev.detail?.timeframe || selectedTf());
      loadKlines({silent:true});
      safeToast(`TF ${ev.detail?.timeframe || selectedTf()}`);
    });

    document.addEventListener("click", (ev) => {
      const menu = document.getElementById("dvlApiSymbolMenu");
      if(!menu || menu.hidden) return;
      if(menu.contains(ev.target) || ev.target.closest("#symbolBtn")) return;
      menu.hidden = true;
    }, true);

    const nav = {
      homeNavBtn:"Início",
      marketsNavBtn:"Mercados",
      tradeNavBtn:"Trade",
      positionsNavBtn:"Posições",
      assetsNavBtn:"Ativos"
    };
    Object.entries(nav).forEach(([id,label])=>{
      const btn = $(id);
      btn?.addEventListener("click", () => {
        document.querySelectorAll("#bottomNav .nav-btn").forEach(b=>b.classList.remove("api-active"));
        btn.classList.add("api-active");
        dispatch("dvl:navigation-change", { nav:label });
      }, true);
    });
  }

  function boot(){
    updateHeader();
    wireApiControls();
    loadKlines({silent:false});
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>



<script id="DVL_PAPER_TRADING_MODULE_0717">
/*
  DVL Beta 0.728 — MODULE: Paper Trading
  Isolated module. Public API:
  - window.DVL_PAPER
  - window.DVL_RENDER_PAPER()
  - window.DVL_CLOSE_PAPER_ORDER(id)
  - CustomEvents: dvl:paper-open, dvl:paper-close, dvl:paper-adjust-request, dvl:paper-adjust-confirm
*/
(function(){
  "use strict";

  const $ = id => document.getElementById(id);
  const toast = msg => {
    if(typeof window.showToast === "function") window.showToast(msg);
    else console.log("[DVL Paper]", msg);
  };

  function loadPaper(){
    try{
      const raw = localStorage.getItem("DVL_PAPER_0717") || localStorage.getItem("DVL_PAPER_0716");
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }

  const paper = window.DVL_PAPER = Object.assign({
    version:"0.728",
    orderType:"Market",
    size:0.01,
    rr:1,
    orders:[],
    drag:null,
    confirm:null
  }, loadPaper());

  function savePaper(){
    try{
      localStorage.setItem("DVL_PAPER_0717", JSON.stringify({
        orderType:paper.orderType,
        size:paper.size,
        rr:paper.rr,
        orders:paper.orders
      }));
    }catch(e){}
  }

  function emit(name, detail={}){
    document.dispatchEvent(new CustomEvent(name, { bubbles:true, detail }));
  }

  function fmt(v, d=1){
    const n = Number(v);
    if(!Number.isFinite(n)) return "--";
    return n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
  }

  function livePrice(){
    const c = window.DVL_API?.candles;
    if(Array.isArray(c) && c.length) return Number(c[c.length-1].close);
    return 0;
  }

  function symbol(){
    return window.DVL_API?.symbol || "BTCUSDT";
  }

  function currentRange(){
    const candles = (window.DVL_API?.candles || []).slice(-58);
    let min=Infinity,max=-Infinity;
    candles.forEach(c=>{ min=Math.min(min, Number(c.low)); max=Math.max(max, Number(c.high)); });
    const live = livePrice();
    if(!Number.isFinite(min) || !Number.isFinite(max) || min===max){
      min = live ? live*0.985 : 66000;
      max = live ? live*1.015 : 68000;
    }
    const pad = Math.max((max-min)*0.16, max*0.0015);
    return {min:min-pad,max:max+pad};
  }

  function priceToPct(price){
    const r = currentRange();
    return (r.max - price) / (r.max - r.min) * 100;
  }

  function pctToPrice(pct){
    const r = currentRange();
    return r.max - (pct / 100) * (r.max - r.min);
  }

  function pnl(o, price=livePrice()){
    const dir = o.side === "buy" ? 1 : -1;
    return (price - o.entry) * dir * o.size;
  }

  function pct(o, price=livePrice()){
    const dir = o.side === "buy" ? 1 : -1;
    return ((price - o.entry) / o.entry) * dir * 100;
  }

  function createOrder(side){
    const price = livePrice();
    if(!(price>0)){ toast("Preço ainda não carregou"); return; }
    const dist = price * 0.004;
    const order = {
      id:"P"+Date.now().toString(36),
      symbol:symbol(),
      side,
      type:paper.orderType.toLowerCase(),
      status:"open",
      entry:price,
      size:Number(paper.size)||0.01,
      tp: side==="buy" ? price + dist*paper.rr : price - dist*paper.rr,
      sl: side==="buy" ? price - dist : price + dist,
      openedAt:Date.now()
    };
    paper.orders.unshift(order);
    savePaper();
    render();
    toast(side==="buy" ? "Buy aberto" : "Sell aberto");
    emit("dvl:paper-open", order);
  }

  function closeOrder(id, reason="manual"){
    const o = paper.orders.find(x=>x.id===id);
    if(!o || o.status !== "open") return;
    o.status = "closed";
    o.closedAt = Date.now();
    o.closedPrice = livePrice() || o.entry;
    o.closedReason = reason;
    clearPending();
    savePaper();
    render();
    toast("Trade fechado");
    emit("dvl:paper-close", o);
  }

  window.DVL_CLOSE_PAPER_ORDER = closeOrder;

  function checkStops(){
    if(paper.drag || paper.confirm) return; // no accidental close while dragging or waiting confirmation
    const c = window.DVL_API?.candles;
    if(!Array.isArray(c) || !c.length) return;
    const last = c[c.length-1];
    paper.orders.filter(o=>o.status==="open").forEach(o=>{
      if(o.side==="buy"){
        if(Number(last.high)>=o.tp) closeOrder(o.id,"tp");
        else if(Number(last.low)<=o.sl) closeOrder(o.id,"sl");
      }else{
        if(Number(last.low)<=o.tp) closeOrder(o.id,"tp");
        else if(Number(last.high)>=o.sl) closeOrder(o.id,"sl");
      }
    });
  }

  function makeLine(parent, cls, price, text, id, kind){
    const y = priceToPct(price);
    if(y < -14 || y > 114) return;

    const l = document.createElement("div");
    l.className = `dvl-paper-line ${cls}`;
    l.dataset.orderId = id;
    l.dataset.kind = kind;
    l.style.top = `${y}%`;
    parent.appendChild(l);

    const t = document.createElement("button");
    t.type = "button";
    t.className = `dvl-paper-tag ${cls} ${kind==="tp" || kind==="sl" ? "draggable" : ""}`;
    t.dataset.orderId = id;
    t.dataset.kind = kind;
    t.style.top = `${y}%`;
    t.innerHTML = text + (cls==="entry" ? `<span class="x">×</span>` : "");
    if(kind === "entry") t.onclick = () => closeOrder(id);
    if(kind === "tp" || kind === "sl") bindSafeDrag(t);
    parent.appendChild(t);
  }

  function bindSafeDrag(tag){
    tag.addEventListener("pointerdown", ev => {
      ev.preventDefault();
      ev.stopPropagation();
      const id = tag.dataset.orderId;
      const kind = tag.dataset.kind;
      const order = paper.orders.find(o=>o.id===id && o.status==="open");
      if(!order) return;
      clearPending();
      paper.drag = {
        id,
        kind,
        startY:ev.clientY,
        price:Number(order[kind]),
        preview:Number(order[kind]),
        pointerId:ev.pointerId
      };
      tag.classList.add("dragging");
      $("dvlPaperLayer")?.classList.add("is-dragging");
      tag.setPointerCapture?.(ev.pointerId);
      renderPreview();
      emit("dvl:paper-adjust-request", { id, kind, price:paper.drag.preview });
    }, {passive:false});
  }

  function clearPreviewOnly(){
    document.querySelectorAll(".dvl-paper-preview-line,.dvl-paper-preview-tag").forEach(x=>x.remove());
  }

  function clearPending(){
    paper.drag = null;
    paper.confirm = null;
    clearPreviewOnly();
    const c = $("dvlPaperConfirm");
    if(c) c.hidden = true;
    $("dvlPaperLayer")?.classList.remove("is-dragging");
    document.querySelectorAll(".dvl-paper-tag.dragging").forEach(x=>x.classList.remove("dragging"));
  }

  function renderPreview(){
    clearPreviewOnly();
    const layer = $("dvlPaperLayer");
    const d = paper.drag || paper.confirm;
    if(!layer || !d) return;
    const y = priceToPct(d.preview);
    const cls = d.kind;

    const line = document.createElement("div");
    line.className = `dvl-paper-preview-line ${cls}`;
    line.style.top = `${y}%`;
    layer.appendChild(line);

    const tag = document.createElement("div");
    tag.className = `dvl-paper-preview-tag ${cls}`;
    tag.style.top = `${y}%`;
    tag.textContent = `${cls.toUpperCase()} ${fmt(d.preview,1)}`;
    layer.appendChild(tag);
  }

  function openConfirm(){
    if(!paper.drag) return;
    paper.confirm = {...paper.drag};
    paper.drag = null;
    document.querySelectorAll(".dvl-paper-tag.dragging").forEach(x=>x.classList.remove("dragging"));
    const c = $("dvlPaperConfirm");
    const title = $("dvlPaperConfirmTitle");
    if(!c || !title) return;
    const y = Math.max(7, Math.min(88, priceToPct(paper.confirm.preview)));
    c.style.top = `${y}%`;
    title.textContent = `Mover ${paper.confirm.kind.toUpperCase()} para ${fmt(paper.confirm.preview,1)}?`;
    c.hidden = false;
    renderPreview();
  }

  function confirmAdjust(){
    if(!paper.confirm) return;
    const o = paper.orders.find(x=>x.id===paper.confirm.id && x.status==="open");
    if(o){
      o[paper.confirm.kind] = paper.confirm.preview;
      savePaper();
      emit("dvl:paper-adjust-confirm", { id:o.id, kind:paper.confirm.kind, price:paper.confirm.preview });
      toast(`${paper.confirm.kind.toUpperCase()} ajustado`);
    }
    clearPending();
    render();
  }

  function cancelAdjust(){
    clearPending();
    render();
    toast("Cancelado");
  }

  function renderLayer(){
    const layer = $("dvlPaperLayer");
    if(!layer) return;

    const confirm = $("dvlPaperConfirm");
    layer.querySelectorAll(".dvl-paper-line,.dvl-paper-tag,.dvl-paper-preview-line,.dvl-paper-preview-tag").forEach(x=>x.remove());
    if(confirm && confirm.parentElement !== layer) layer.appendChild(confirm);

    paper.orders.filter(o=>o.status==="open" && o.symbol===symbol()).forEach(o=>{
      makeLine(layer, "tp", o.tp, `TP ${fmt(o.tp,1)}`, o.id, "tp");
      makeLine(layer, "entry", o.entry, `${o.side.toUpperCase()} ${fmt(pnl(o),2)}$`, o.id, "entry");
      makeLine(layer, "sl", o.sl, `SL ${fmt(o.sl,1)}`, o.id, "sl");
    });

    if(paper.drag || paper.confirm) renderPreview();
  }

  function renderPositions(){
    const list = $("dvlPositionsList");
    const count = $("dvlPositionsCount");
    if(!list) return;
    const open = paper.orders.filter(o=>o.status==="open");
    if(count) count.textContent = `${open.length} abertas`;
    if(!open.length){
      list.innerHTML = `<div class="dvl-empty">Nenhuma posição aberta.</div>`;
      return;
    }
    list.innerHTML = open.map(o=>{
      const p = pnl(o);
      const pc = pct(o);
      return `<article class="dvl-position-card">
        <div class="dvl-position-top"><span class="${o.side==="buy"?"dvl-side-buy":"dvl-side-sell"}">${o.side.toUpperCase()} ${o.symbol}</span><span class="${p>=0?"dvl-side-buy":"dvl-side-sell"}">${fmt(p,2)} USDT</span></div>
        <div class="dvl-position-grid">
          <span>Entry<b>${fmt(o.entry,1)}</b></span>
          <span>TP<b>${fmt(o.tp,1)}</b></span>
          <span>SL<b>${fmt(o.sl,1)}</b></span>
          <span>Size<b>${o.size}</b></span>
          <span>Pct<b>${fmt(pc,2)}%</b></span>
          <span>Tipo<b>${o.type}</b></span>
        </div>
        <button class="dvl-close-trade" data-close="${o.id}" type="button">Fechar posição</button>
      </article>`;
    }).join("");
    list.querySelectorAll("[data-close]").forEach(btn=>btn.onclick=()=>closeOrder(btn.dataset.close));
  }

  function renderPanel(){
    const lp = $("dvlPaperLivePrice");
    if(lp) lp.textContent = `${symbol()} ${fmt(livePrice(),1)}`;
    const ot = $("dvlOrderTypeLabel");
    if(ot) ot.textContent = paper.orderType;
    const sz = $("dvlPaperSizeLabel");
    if(sz) sz.textContent = String(paper.size);
    const rr = $("dvlPaperRRLabel");
    if(rr) rr.textContent = `${paper.rr}:1`;
    document.querySelectorAll(".dvl-trade-action span").forEach(s=>s.textContent=paper.orderType);
  }

  function render(){
    checkStops();
    renderPanel();
    renderLayer();
    renderPositions();
  }

  function toggleTrade(){
    const p = $("dvlTradePanel");
    if(!p) return;
    const open = p.hidden;
    p.hidden = !open;
    $("dvlPositionsPanel") && ($("dvlPositionsPanel").hidden = true);
    render();
  }

  function togglePositions(){
    const p = $("dvlPositionsPanel");
    if(!p) return;
    const open = p.hidden;
    p.hidden = !open;
    $("dvlTradePanel") && ($("dvlTradePanel").hidden = true);
    render();
  }

  function wire(){
    $("tradeNavBtn")?.addEventListener("click", (ev)=>{
      ev.preventDefault();
      ev.stopImmediatePropagation();
      toggleTrade();
    }, true);

    $("positionsNavBtn")?.addEventListener("click", (ev)=>{
      ev.preventDefault();
      ev.stopImmediatePropagation();
      togglePositions();
    }, true);

    $("dvlCloseTradePanel")?.addEventListener("click", ()=> $("dvlTradePanel").hidden = true);
    $("dvlClosePositionsPanel")?.addEventListener("click", ()=> $("dvlPositionsPanel").hidden = true);
    $("dvlPaperBuyBtn")?.addEventListener("click", ()=>createOrder("buy"));
    $("dvlPaperSellBtn")?.addEventListener("click", ()=>createOrder("sell"));

    $("dvlOrderTypeBtn")?.addEventListener("click", ()=>{
      paper.orderType = paper.orderType === "Market" ? "Limit" : paper.orderType === "Limit" ? "Stop" : "Market";
      savePaper(); render(); toast(paper.orderType);
    });

    $("dvlPaperSizeBtn")?.addEventListener("click", ()=>{
      const opts=[0.01,0.02,0.05,0.1,0.2];
      const i=opts.indexOf(Number(paper.size));
      paper.size = opts[(i+1+opts.length)%opts.length];
      savePaper(); render(); toast(`Size ${paper.size}`);
    });

    $("dvlPaperRRBtn")?.addEventListener("click", ()=>{
      const opts=[1,1.5,2,3];
      const i=opts.indexOf(Number(paper.rr));
      paper.rr = opts[(i+1+opts.length)%opts.length];
      savePaper(); render(); toast(`R:R ${paper.rr}:1`);
    });

    document.addEventListener("pointermove", ev => {
      if(!paper.drag) return;
      ev.preventDefault();
      const layer = $("dvlPaperLayer");
      if(!layer) return;
      const rect = layer.getBoundingClientRect();
      const y = Math.max(0, Math.min(rect.height, ev.clientY - rect.top));
      paper.drag.preview = pctToPrice((y/rect.height)*100);
      renderPreview();
    }, {passive:false});

    document.addEventListener("pointerup", ev => {
      if(!paper.drag) return;
      ev.preventDefault();
      openConfirm();
    }, {passive:false});

    $("dvlPaperConfirmOk")?.addEventListener("click", confirmAdjust);
    $("dvlPaperConfirmCancel")?.addEventListener("click", cancelAdjust);

    document.addEventListener("dvl:market-render", render);
    document.addEventListener("dvl:symbol-change", ()=>setTimeout(render,80));

    window.DVL_RENDER_PAPER = render;
    render();
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", wire);
  else wire();
})();
</script>




<script id="DVL_UNIFIED_ANCHORED_DROPDOWNS_0719">
/*
  DVL Beta 0.728 — Price Scale Zoom Patch
  Rule: every dropdown opens near the clicked control, same behavior family as TF.
  This is a fallback bridge while legacy functions are migrated.
*/
(function(){
  "use strict";

  const $ = id => document.getElementById(id);
  const toast = msg => {
    if(typeof window.showToast === "function") window.showToast(msg);
    else {
      const t = $("dvlToast");
      if(t){ t.textContent = msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 750); }
      console.log("[DVL]", msg);
    }
  };

  function dispatch(name, detail={}){
    document.dispatchEvent(new CustomEvent(name, { bubbles:true, detail }));
  }

  function ensurePop(){
    let pop = $("dvlHardFallbackPop");
    if(!pop){
      pop = document.createElement("div");
      pop.id = "dvlHardFallbackPop";
      pop.className = "dvl-hard-fallback-pop";
      pop.hidden = true;
      document.body.appendChild(pop);
    }
    return pop;
  }

  function positionNearAnchor(pop, anchor, width=236){
    if(!anchor) return;
    const r = anchor.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const margin = 8;

    width = Math.min(width, vw - margin * 2);
    pop.style.width = `${width}px`;

    let left = r.left;
    if(left + width > vw - margin) left = vw - width - margin;
    if(left < margin) left = margin;

    pop.hidden = false;
    const h = Math.min(pop.scrollHeight || 180, vh * 0.52);
    let top = r.bottom + 6;

    if(top + h > vh - margin){
      top = r.top - h - 6;
    }
    if(top < margin) top = margin;

    pop.style.left = `${left}px`;
    pop.style.top = `${top}px`;
  }

  function menuWidth(title){
    if(title === "Indicadores") return 238;
    if(title === "Desenhos") return 244;
    if(title === "Velas") return 218;
    if(title === "Configurações") return 220;
    return 230;
  }

  function showPop(title, rows, anchor){
    const pop = ensurePop();
    pop.innerHTML = `<h3>${title}</h3>` + rows.map(r=>`<button type="button" data-action="${r.action}" class="${r.active?'is-active':''}"><span>${r.label}</span><small>${r.value||""}</small></button>`).join("");
    pop.hidden = false;
    positionNearAnchor(pop, anchor, menuWidth(title));

    pop.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{
      const action = btn.dataset.action;
      dispatch("dvl:dropdown-action", { title, action });
      pop.hidden = true;
      toast(btn.textContent.trim());
    });
  }

  function closePop(){
    const pop = $("dvlHardFallbackPop");
    if(pop) pop.hidden = true;
  }

  function togglePanel(id){
    const panel = $(id);
    if(!panel) return false;
    const willOpen = panel.hidden;
    document.querySelectorAll("#dvlTradePanel,#dvlPositionsPanel").forEach(p => p.hidden = true);
    panel.hidden = !willOpen;
    if(willOpen && typeof window.DVL_RENDER_PAPER === "function") window.DVL_RENDER_PAPER();
    return true;
  }

  function clickTarget(ev, selector){
    return ev.target && ev.target.closest ? ev.target.closest(selector) : null;
  }

  document.addEventListener("click", function(ev){
    const trade = clickTarget(ev, "#tradeNavBtn");
    if(trade){
      ev.preventDefault(); ev.stopPropagation();
      closePop();
      togglePanel("dvlTradePanel") || toast("Trade");
      return;
    }

    const positions = clickTarget(ev, "#positionsNavBtn");
    if(positions){
      ev.preventDefault(); ev.stopPropagation();
      closePop();
      togglePanel("dvlPositionsPanel") || toast("Posições");
      return;
    }

    const save = clickTarget(ev, "#profileSaveBtn");
    if(save){
      ev.preventDefault();
      closePop();
      const profile = {
        version:window.DVL_APP_VERSION || "0.728",
        symbol:window.DVL_API?.symbol || $("symbolText")?.textContent || "BTC/USDT",
        timeframe:window.DVL_SELECTED_TIMEFRAME || $("tfMoreBtn")?.dataset?.timeframe || "5m",
        savedAt:new Date().toISOString()
      };
      try{ localStorage.setItem("DVL_PROFILE_MAIN", JSON.stringify(profile)); }catch(e){}
      save.classList.add("saved-pulse");
      setTimeout(()=>save.classList.remove("saved-pulse"), 450);
      dispatch("dvl:profile-save", profile);
      toast("Perfil salvo");
      return;
    }

    const fav = clickTarget(ev, "#currentFavoriteBtn");
    if(fav){
      ev.preventDefault();
      closePop();
      fav.classList.toggle("is-favorite");
      dispatch("dvl:favorite-change", { favorite:fav.classList.contains("is-favorite") });
      toast(fav.classList.contains("is-favorite") ? "Favoritado" : "Removido");
      return;
    }

    const candles = clickTarget(ev, "#candleTypeBtn");
    if(candles){
      ev.preventDefault();
      ev.stopPropagation();
      showPop("Velas", [
        {label:"Velas", action:"candles", active:true},
        {label:"Heikin Ashi", action:"heikin"},
        {label:"Linha", action:"line"},
        {label:"Área", action:"area"}
      ], candles);
      return;
    }

    const indicators = clickTarget(ev, "#toggleIndicators");
    if(indicators){
      ev.preventDefault();
      ev.stopPropagation();
      const oscState = window.DVL_OSCILLATORS?.state || window.DVL_CHART_ENGINE?.indicators || {RSI:true, MACD:true};
      showPop("Indicadores", [
        {label:"RSI", action:"rsi", value:oscState.RSI ? "ON" : "OFF", active:!!oscState.RSI},
        {label:"MACD", action:"macd", value:oscState.MACD ? "ON" : "OFF", active:!!oscState.MACD},
        {label:"DVL Flow", action:"flow", value:"OFF"},
        {label:"Clarity", action:"clarity", value:"OFF"}
      ], indicators);
      return;
    }

    const drawings = clickTarget(ev, "#assetToolsGear");
    if(drawings){
      ev.preventDefault();
      ev.stopPropagation();
      showPop("Desenhos", [
        {label:"Linha", action:"line"},
        {label:"Retângulo", action:"rect"},
        {label:"Régua", action:"ruler"},
        {label:"Long position", action:"long"},
        {label:"Short position", action:"short"}
      ], drawings);
      return;
    }

    const settings = clickTarget(ev, "#chartSettingsBtn,#chartMiniSettingsBtn");
    if(settings){
      ev.preventDefault();
      ev.stopPropagation();
      showPop("Configurações", [
        {label:"Grid", action:"grid", value:"ON"},
        {label:"Volume", action:"volume", value:"ON"},
        {label:"Reset visual", action:"reset"}
      ], settings);
      return;
    }

    const nav = clickTarget(ev, "#homeNavBtn,#marketsNavBtn,#assetsNavBtn");
    if(nav){
      closePop();
      document.querySelectorAll("#bottomNav .nav-btn").forEach(b=>b.classList.remove("api-active"));
      nav.classList.add("api-active");
      dispatch("dvl:navigation-change", { nav:nav.id });
      toast(nav.textContent.trim());
      return;
    }

    if(!ev.target.closest("#dvlHardFallbackPop,#tfMoreWrap")) closePop();
  }, true);

  window.addEventListener("resize", closePop);
  window.addEventListener("scroll", closePop, true);

  window.DVL_CLICK_BRIDGE_ACTIVE = true;
  window.DVL_DROPDOWN_ANCHOR_SYSTEM = "0.728";
  window.DVL_DIAG = function(){
    return {
      version:window.DVL_APP_VERSION,
      api:!!window.DVL_API,
      apiSymbol:window.DVL_API?.symbol,
      candles:window.DVL_API?.candles?.length || 0,
      paper:!!window.DVL_PAPER,
      paperOrders:window.DVL_PAPER?.orders?.length || 0,
      clickBridge:!!window.DVL_CLICK_BRIDGE_ACTIVE,
      dropdownAnchorSystem:window.DVL_DROPDOWN_ANCHOR_SYSTEM,
      elements:{
        trade:!!$("tradeNavBtn"),
        positions:!!$("positionsNavBtn"),
        tradePanel:!!$("dvlTradePanel"),
        positionsPanel:!!$("dvlPositionsPanel"),
        paperLayer:!!$("dvlPaperLayer")
      }
    };
  };
})();
</script>



<script id="DVL_PAPER_PENDING_ORDERS_0720">
/*
  DVL Beta 0.728 — MODULE: Paper Pending Orders
  Isolated module over the Paper Trading module.
  Behavior:
  - Market still opens immediately.
  - Limit/Stop opens an editable entry preview line first.
  - OK creates pending order.
  - Pending order triggers when candle touches entry.
*/
(function(){
  "use strict";

  const $ = id => document.getElementById(id);
  const toast = msg => {
    if(typeof window.showToast === "function") window.showToast(msg);
    else console.log("[DVL Pending]", msg);
  };

  const pending = window.DVL_PENDING = {
    version:"0.728",
    draft:null,
    drag:null
  };

  function emit(name, detail={}){
    document.dispatchEvent(new CustomEvent(name, { bubbles:true, detail }));
  }

  function fmt(v, d=1){
    const n = Number(v);
    if(!Number.isFinite(n)) return "--";
    return n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
  }

  function apiCandles(){
    return window.DVL_API?.candles || [];
  }

  function livePrice(){
    const c = apiCandles();
    if(Array.isArray(c) && c.length) return Number(c[c.length-1].close);
    return 0;
  }

  function symbol(){
    return window.DVL_API?.symbol || "BTCUSDT";
  }

  function currentRange(){
    const candles = apiCandles().slice(-58);
    let min=Infinity,max=-Infinity;
    candles.forEach(c=>{ min=Math.min(min, Number(c.low)); max=Math.max(max, Number(c.high)); });
    const live = livePrice();
    if(!Number.isFinite(min) || !Number.isFinite(max) || min===max){
      min = live ? live*0.985 : 66000;
      max = live ? live*1.015 : 68000;
    }
    const pad = Math.max((max-min)*0.16, max*0.0015);
    return {min:min-pad,max:max+pad};
  }

  function priceToPct(price){
    const r = currentRange();
    return (r.max - price) / (r.max - r.min) * 100;
  }

  function pctToPrice(pct){
    const r = currentRange();
    return r.max - (pct / 100) * (r.max - r.min);
  }

  function orderType(){
    return window.DVL_PAPER?.orderType || document.getElementById("dvlOrderTypeLabel")?.textContent || "Market";
  }

  function defaultPendingPrice(side, type){
    const p = livePrice();
    if(!(p>0)) return 0;
    const dist = p * 0.0025;
    if(type === "Limit") return side === "buy" ? p - dist : p + dist;
    if(type === "Stop") return side === "buy" ? p + dist : p - dist;
    return p;
  }

  function savePaper(){
    try{
      const paper = window.DVL_PAPER;
      if(!paper) return;
      localStorage.setItem("DVL_PAPER_0717", JSON.stringify({
        orderType:paper.orderType,
        size:paper.size,
        rr:paper.rr,
        orders:paper.orders
      }));
    }catch(e){}
  }

  function clearDraft(){
    pending.draft = null;
    pending.drag = null;
    const c = $("dvlPendingConfirm");
    if(c) c.hidden = true;
    renderPending();
  }

  function createDraft(side){
    const type = orderType();
    const price = defaultPendingPrice(side, type);
    if(!(price>0)){ toast("Preço ainda não carregou"); return; }
    pending.draft = {
      id:"DRAFT"+Date.now().toString(36),
      side,
      type:type.toLowerCase(),
      entry:price,
      size:Number(window.DVL_PAPER?.size || 0.01),
      rr:Number(window.DVL_PAPER?.rr || 1),
      symbol:symbol()
    };
    renderPending();
    openConfirm();
    toast(`${type} ${side.toUpperCase()} em ajuste`);
    emit("dvl:pending-draft", pending.draft);
  }

  function makePendingOrder(){
    const d = pending.draft;
    if(!d || !window.DVL_PAPER) return;

    const dist = d.entry * 0.004;
    const order = {
      id:"PEND"+Date.now().toString(36),
      symbol:d.symbol,
      side:d.side,
      type:d.type,
      status:"pending",
      entry:d.entry,
      size:d.size,
      tp:d.side==="buy" ? d.entry + dist*d.rr : d.entry - dist*d.rr,
      sl:d.side==="buy" ? d.entry - dist : d.entry + dist,
      createdAt:Date.now()
    };

    window.DVL_PAPER.orders.unshift(order);
    savePaper();
    pending.draft = null;
    const c = $("dvlPendingConfirm");
    if(c) c.hidden = true;
    renderPending();
    if(typeof window.DVL_RENDER_PAPER === "function") window.DVL_RENDER_PAPER();
    toast("Ordem pendente criada");
    emit("dvl:pending-created", order);
  }

  function cancelPending(){
    clearDraft();
    toast("Pendente cancelada");
  }

  function ySafe(price){
    return Math.max(-10, Math.min(110, priceToPct(price)));
  }

  function appendLine(layer, item, isDraft=false){
    const y = ySafe(item.entry);
    const line = document.createElement("div");
    line.className = "dvl-paper-line pending-entry";
    line.style.top = `${y}%`;
    layer.appendChild(line);

    const tag = document.createElement("button");
    tag.type = "button";
    tag.className = `dvl-paper-tag pending-entry ${isDraft ? "active" : ""}`;
    tag.dataset.pendingId = item.id;
    tag.dataset.isDraft = isDraft ? "1" : "0";
    tag.style.top = `${y}%`;
    const label = isDraft ? "DRAFT" : item.status.toUpperCase();
    tag.innerHTML = `${item.side.toUpperCase()} ${fmt(item.entry,1)} <span class="dvl-pending-badge">${label}</span><span class="x">×</span>`;
    tag.addEventListener("pointerdown", ev => startDrag(ev, item, isDraft), {passive:false});
    tag.querySelector(".x")?.addEventListener("click", ev => {
      ev.preventDefault();
      ev.stopPropagation();
      if(isDraft) cancelPending();
      else cancelOrder(item.id);
    });
    layer.appendChild(tag);
  }

  function cancelOrder(id){
    const paper = window.DVL_PAPER;
    const o = paper?.orders?.find(x=>x.id===id && x.status==="pending");
    if(!o) return;
    o.status = "cancelled";
    o.closedAt = Date.now();
    o.closedReason = "cancelled";
    savePaper();
    renderPending();
    if(typeof window.DVL_RENDER_PAPER === "function") window.DVL_RENDER_PAPER();
    toast("Pendente cancelada");
    emit("dvl:pending-cancel", o);
  }

  function renderPending(){
    const layer = $("dvlPaperLayer");
    if(!layer) return;

    layer.querySelectorAll(".dvl-paper-line.pending-entry,.dvl-paper-tag.pending-entry,.dvl-paper-preview-line.pending,.dvl-paper-preview-tag.pending").forEach(x=>x.remove());

    const paper = window.DVL_PAPER;
    const open = (paper?.orders || []).filter(o => o.status === "pending" && o.symbol === symbol());
    open.forEach(o => appendLine(layer, o, false));
    if(pending.draft) appendLine(layer, pending.draft, true);

    if(pending.drag) renderPreview();
  }

  function renderPreview(){
    const layer = $("dvlPaperLayer");
    if(!layer || !pending.drag) return;
    layer.querySelectorAll(".dvl-paper-preview-line.pending,.dvl-paper-preview-tag.pending").forEach(x=>x.remove());
    const y = ySafe(pending.drag.price);
    const line = document.createElement("div");
    line.className = "dvl-paper-preview-line pending";
    line.style.top = `${y}%`;
    layer.appendChild(line);

    const tag = document.createElement("div");
    tag.className = "dvl-paper-preview-tag pending";
    tag.style.top = `${y}%`;
    tag.textContent = `ENTRY ${fmt(pending.drag.price,1)}`;
    layer.appendChild(tag);
  }

  function startDrag(ev, item, isDraft){
    ev.preventDefault();
    ev.stopPropagation();
    pending.drag = {
      id:item.id,
      isDraft,
      price:Number(item.entry),
      pointerId:ev.pointerId
    };
    ev.currentTarget.setPointerCapture?.(ev.pointerId);
    renderPreview();
  }

  function moveDrag(ev){
    if(!pending.drag) return;
    ev.preventDefault();
    const layer = $("dvlPaperLayer");
    if(!layer) return;
    const rect = layer.getBoundingClientRect();
    const y = Math.max(0, Math.min(rect.height, ev.clientY - rect.top));
    pending.drag.price = pctToPrice((y/rect.height)*100);
    renderPreview();
  }

  function endDrag(ev){
    if(!pending.drag) return;
    ev.preventDefault();
    const d = pending.drag;

    if(d.isDraft && pending.draft){
      pending.draft.entry = d.price;
      pending.drag = null;
      renderPending();
      openConfirm();
      return;
    }

    const paper = window.DVL_PAPER;
    const o = paper?.orders?.find(x=>x.id===d.id && x.status==="pending");
    if(o){
      o.entry = d.price;
      const dist = o.entry * 0.004;
      o.tp = o.side==="buy" ? o.entry + dist*(Number(o.rr)||1) : o.entry - dist*(Number(o.rr)||1);
      o.sl = o.side==="buy" ? o.entry - dist : o.entry + dist;
      savePaper();
      emit("dvl:pending-moved", { id:o.id, entry:o.entry });
      toast("Entrada ajustada");
    }

    pending.drag = null;
    renderPending();
    if(typeof window.DVL_RENDER_PAPER === "function") window.DVL_RENDER_PAPER();
  }

  function openConfirm(){
    const d = pending.draft;
    const c = $("dvlPendingConfirm");
    const title = $("dvlPendingConfirmTitle");
    if(!d || !c || !title) return;
    const y = Math.max(7, Math.min(84, priceToPct(d.entry)));
    c.style.top = `${y}%`;
    title.textContent = `${d.type.toUpperCase()} ${d.side.toUpperCase()} ${fmt(d.entry,1)}?`;
    c.hidden = false;
  }

  function triggerPending(){
    const paper = window.DVL_PAPER;
    const candles = apiCandles();
    if(!paper || !candles.length) return;
    const last = candles[candles.length-1];

    paper.orders.filter(o=>o.status==="pending" && o.symbol===symbol()).forEach(o=>{
      const high = Number(last.high);
      const low = Number(last.low);
      let hit = false;
      if(o.type === "limit"){
        hit = o.side === "buy" ? low <= o.entry : high >= o.entry;
      }else if(o.type === "stop"){
        hit = o.side === "buy" ? high >= o.entry : low <= o.entry;
      }
      if(hit){
        o.status = "open";
        o.openedAt = Date.now();
        o.triggeredAt = Date.now();
        emit("dvl:pending-triggered", o);
        toast("Pendente executada");
      }
    });
    savePaper();
  }

  function wire(){
    // Intercept Buy/Sell only for non-Market orders. Market remains handled by existing Paper module.
    $("dvlPaperBuyBtn")?.addEventListener("click", ev => {
      if(orderType() === "Market") return;
      ev.preventDefault();
      ev.stopImmediatePropagation();
      createDraft("buy");
    }, true);

    $("dvlPaperSellBtn")?.addEventListener("click", ev => {
      if(orderType() === "Market") return;
      ev.preventDefault();
      ev.stopImmediatePropagation();
      createDraft("sell");
    }, true);

    $("dvlPendingConfirmOk")?.addEventListener("click", ev => {
      ev.preventDefault();
      ev.stopPropagation();
      makePendingOrder();
    });

    $("dvlPendingConfirmCancel")?.addEventListener("click", ev => {
      ev.preventDefault();
      ev.stopPropagation();
      cancelPending();
    });

    document.addEventListener("pointermove", moveDrag, {passive:false});
    document.addEventListener("pointerup", endDrag, {passive:false});

    document.addEventListener("dvl:market-render", () => {
      triggerPending();
      renderPending();
    });

    document.addEventListener("dvl:symbol-change", () => setTimeout(renderPending,80));

    window.DVL_RENDER_PENDING = renderPending;
    renderPending();
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", wire);
  else wire();
})();
</script>


<script id="DVL_INTERACTIVE_CHART_ENGINE_0721">
/*
  DVL Beta 0.728 — MODULE: Price Scale Zoom Patch
  Fixes "static chart" perception:
  - Re-renders from DVL_API.candles every second.
  - Polls Binance REST as fallback if WS does not move.
  - Supports horizontal pan by dragging chart.
  - Supports zoom by mouse wheel and mobile pinch.
  - RSI/MACD are recalculated from visible candle data.
*/
(function(){
  "use strict";

  const $ = id => document.getElementById(id);
  const REST = "https://fapi.binance.com";
  const state = window.DVL_CHART_ENGINE = {
    version:"0.728",
    visibleBars:58,
    offset:0,
    minBars:22,
    maxBars:90,
    lastRenderKey:"",
    lastApiLen:0,
    lastApiClose:null,
    lastPollAt:0,
    lastWsMoveAt:Date.now(),
    indicators:{ RSI:true, MACD:true }
  };

  function api(){
    return window.DVL_API || {};
  }

  function candles(){
    const c = api().candles;
    return Array.isArray(c) ? c.filter(x => Number.isFinite(Number(x.close))) : [];
  }

  function symbol(){
    return api().symbol || "BTCUSDT";
  }

  function interval(){
    return api().interval || "5m";
  }

  function fmt(v,d=1){
    const n = Number(v);
    if(!Number.isFinite(n)) return "--";
    return n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
  }

  function svgEl(tag, attrs={}){
    const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,String(v)));
    return el;
  }

  function visibleCandles(){
    const all = candles();
    if(!all.length) return [];
    const bars = Math.max(state.minBars, Math.min(state.maxBars, state.visibleBars));
    const end = Math.max(0, all.length - state.offset);
    const start = Math.max(0, end - bars);
    return all.slice(start, end);
  }

  function rangeFrom(data){
    let min=Infinity,max=-Infinity;
    data.forEach(c => {
      min = Math.min(min, Number(c.low));
      max = Math.max(max, Number(c.high));
    });
    if(!Number.isFinite(min) || !Number.isFinite(max) || min===max){
      const p = Number(data[data.length-1]?.close) || 63000;
      min = p*.985; max = p*1.015;
    }
    const pad = Math.max((max-min)*.14, max*.0012);
    const rawMin = min-pad;
    const rawMax = max+pad;

    // DVL 0.728: light price-scale zoom/pan hook.
    const scaleState = window.DVL_PRICE_SCALE_0728;
    if(scaleState){
      const zoom = Math.max(.45, Math.min(8, Number(scaleState.zoom) || 1));
      const baseMid = (rawMin + rawMax) / 2;
      const span = (rawMax - rawMin) / zoom;
      const mid = baseMid + (Number(scaleState.offset) || 0);
      const range = {min:mid-span/2, max:mid+span/2};
      scaleState.lastRawRange = {min:rawMin, max:rawMax};
      scaleState.lastRange = range;
      return range;
    }

    return {min:rawMin, max:rawMax};
  }

  function yFor(price, range, h){
    return (range.max - price) / (range.max - range.min) * h;
  }

  function pctFor(price, range){
    return (range.max - price) / (range.max - range.min) * 100;
  }

  function setOHLC(data){
    const ohlc = $("dvlOHLC");
    if(!ohlc || !data.length) return;
    const last = data[data.length-1];
    const prev = data[data.length-2] || last;
    const diff = Number(last.close) - Number(prev.close);
    const pct = Number(prev.close) ? diff/Number(prev.close)*100 : 0;
    const up = diff >= 0;
    ohlc.innerHTML = `
      <span><b class="ohlc-label">O</b>${fmt(last.open,1)}</span>
      <span><b class="ohlc-label">H</b>${fmt(last.high,1)}</span>
      <span><b class="ohlc-label">L</b>${fmt(last.low,1)}</span>
      <span><b class="ohlc-label">C</b><b class="${up?'ohlc-green':''}">${fmt(last.close,1)}</b></span>
      <span class="${up?'ohlc-green':''}">${up?'+':''}${fmt(diff,1)} (${up?'+':''}${fmt(pct,2)}%)</span>
    `;
  }

  function setTimeScale(data){
    const box = $("dvlTimeScale");
    if(!box || data.length < 2) return;
    const fmtTime = new Intl.DateTimeFormat("pt-BR", {hour:"2-digit",minute:"2-digit"});
    const idxs = [0,.25,.5,.75,1].map(p => Math.round((data.length-1)*p));
    box.innerHTML = idxs.map(i => `<span>${fmtTime.format(new Date(Number(data[i].t)))}</span>`).join("");
  }

  function renderPriceScale(data, range){
    const scale = $("dvlPriceScale");
    const lines = $("dvlTradeLines");
    if(!scale || !lines || !data.length) return;
    scale.innerHTML = "";
    lines.innerHTML = "";

    const steps = 9;
    for(let i=0;i<=steps;i++){
      const price = range.max - (range.max-range.min)*(i/steps);
      const s = document.createElement("span");
      s.className = "scale-label";
      s.textContent = fmt(price,1);
      s.style.top = `${(i/steps)*100}%`;
      scale.appendChild(s);
    }

    const current = Number(data[data.length-1].close);
    const y = pctFor(current, range);

    const line = document.createElement("div");
    line.className = "trade-line green dashed";
    line.style.top = `calc(var(--plot-y) * var(--px) + ${y}% * var(--plot-h) / 100)`;
    lines.appendChild(line);

    const pill = document.createElement("div");
    pill.className = "price-pill green dvl-scale-current";
    pill.style.top = `${y}%`;
    pill.innerHTML = `${fmt(current,1)}<small>${new Intl.DateTimeFormat("pt-BR",{hour:"2-digit",minute:"2-digit"}).format(new Date())}</small>`;
    scale.appendChild(pill);
  }

  function renderCandles(data, range){
    const svg = $("dvlChartSvg");
    const vol = $("dvlVolumeSvg");
    const plot = $("dvlChartPlot");
    if(!svg || !vol || !data.length) return;

    svg.innerHTML = "";
    vol.innerHTML = "";

    const w=756, h=602, volH=132;
    const n = data.length;
    const step = w / Math.max(n,1);
    const bodyW = Math.max(3.2, Math.min(9.5, step*.56));
    const maxVol = Math.max(...data.map(c=>Number(c.volume)||0),1);

    data.forEach((c,i)=>{
      const x = i*step + (step-bodyW)/2;
      const up = Number(c.close) >= Number(c.open);
      const color = up ? "#10df77" : "#ff3037";
      const yHigh = yFor(Number(c.high),range,h);
      const yLow = yFor(Number(c.low),range,h);
      const yOpen = yFor(Number(c.open),range,h);
      const yClose = yFor(Number(c.close),range,h);

      svg.appendChild(svgEl("line", {
        x1:x+bodyW/2, x2:x+bodyW/2, y1:yHigh, y2:yLow,
        stroke:color, "stroke-width":1.8, "stroke-linecap":"round"
      }));

      svg.appendChild(svgEl("rect", {
        x, y:Math.min(yOpen,yClose), width:bodyW,
        height:Math.max(2, Math.abs(yClose-yOpen)),
        rx:.7, fill:color, opacity:.96
      }));

      const vh = Math.max(3,(Number(c.volume)||0)/maxVol * (volH-4));
      vol.appendChild(svgEl("rect", {
        x, y:volH-vh, width:Math.max(2,bodyW+1), height:vh,
        fill:up ? "rgba(16,223,119,.52)" : "rgba(255,48,55,.50)"
      }));
    });

    if(plot){
      const lastClose = Number(data[data.length-1].close);
      const moved = state.lastApiClose === null || Math.abs(lastClose - state.lastApiClose) > 0;
      plot.classList.toggle("is-live", moved || Date.now()-state.lastWsMoveAt < 6000);
      plot.classList.toggle("is-offline", Date.now()-state.lastWsMoveAt > 20000);
      state.lastApiClose = lastClose;
    }
  }

  function ema(values, period){
    if(!values.length) return [];
    const k=2/(period+1);
    const out=[];
    let prev=values[0];
    values.forEach((v,i)=>{
      prev = i===0 ? v : v*k + prev*(1-k);
      out.push(prev);
    });
    return out;
  }

  function calcRSI(closes, period=14){
    if(closes.length < period+1) return closes.map(()=>50);
    let gain=0, loss=0;
    for(let i=1;i<=period;i++){
      const d=closes[i]-closes[i-1];
      if(d>=0) gain+=d; else loss-=d;
    }
    let ag=gain/period, al=loss/period;
    const out=Array(period).fill(50);
    out.push(al===0?100:100-100/(1+ag/al));
    for(let i=period+1;i<closes.length;i++){
      const d=closes[i]-closes[i-1];
      ag=(ag*(period-1)+Math.max(d,0))/period;
      al=(al*(period-1)+Math.max(-d,0))/period;
      out.push(al===0?100:100-100/(1+ag/al));
    }
    return out;
  }

  function renderRSI(allData, viewData){
    const sec = $("dvlRSISection");
    const svg = $("dvlRSISvg");
    const scale = $("dvlRSIScale");
    if(!sec || !svg || !scale) return;
    sec.classList.toggle("is-hidden", !state.indicators.RSI);
    if(!state.indicators.RSI) return;

    const closes = allData.map(c=>Number(c.close));
    const valsAll = calcRSI(closes);
    const vals = valsAll.slice(-Math.max(state.visibleBars, viewData.length));
    const current = valsAll[valsAll.length-1] || 50;

    const title = sec.querySelector(".osc-title");
    if(title) title.innerHTML = `<span>RSI (14)</span><span class="value">${fmt(current,2)}</span>`;

    svg.innerHTML = "";
    const w=748,h=125;
    const y = v => (80 - Math.max(20,Math.min(80,v))) / 60 * h;
    const pts = vals.map((v,i)=>`${(i/Math.max(vals.length-1,1))*w},${y(v)}`).join(" ");
    svg.appendChild(svgEl("polyline", {points:pts, fill:"none", stroke:"#10df77", "stroke-width":2.2, "stroke-linejoin":"round", "stroke-linecap":"round"}));

    const yPct = Math.max(0, Math.min(100, (80-current)/60*100));
    scale.innerHTML = `<span style="top:0%">80,00</span><span style="top:32%">60,00</span><span style="top:66%">40,00</span><span style="top:100%">20,00</span><span class="osc-current" style="top:${yPct}%">${fmt(current,2)}</span>`;
  }

  function renderMACD(allData){
    const sec = $("dvlMACDSection");
    const svg = $("dvlMACDSvg");
    const scale = $("dvlMACDScale");
    if(!sec || !svg || !scale) return;
    sec.classList.toggle("is-hidden", !state.indicators.MACD);
    if(!state.indicators.MACD) return;

    const closes = allData.map(c=>Number(c.close));
    const ema12=ema(closes,12), ema26=ema(closes,26);
    const macd=closes.map((_,i)=>ema12[i]-ema26[i]);
    const signal=ema(macd,9);
    const hist=macd.map((v,i)=>v-signal[i]);

    const bars = Math.max(state.visibleBars, 22);
    const m=macd.slice(-bars), s=signal.slice(-bars), hst=hist.slice(-bars);
    const lastM=m[m.length-1]||0, lastS=s[s.length-1]||0, lastH=hst[hst.length-1]||0;

    const title = sec.querySelector(".osc-title");
    if(title) title.innerHTML = `<span>MACD (12, 26, close)</span> <span class="value">${fmt(lastM,1)}</span> <span class="value red">${fmt(lastS,1)}</span> <span class="value yellow">${fmt(lastH,1)}</span>`;

    svg.innerHTML = "";
    const w=748, hh=125, zero=hh*.58;
    const maxAbs = Math.max(1,...m.map(Math.abs),...s.map(Math.abs),...hst.map(Math.abs));
    const y = v => zero - (v/maxAbs)*hh*.46;
    const step = w/Math.max(hst.length,1);
    const bw = Math.max(2, Math.min(10, step*.58));
    hst.forEach((v,i)=>{
      const x=i*step+(step-bw)/2;
      const yy=v>=0?y(v):zero;
      svg.appendChild(svgEl("rect", {x, y:yy, width:bw, height:Math.max(2,Math.abs(y(v)-zero)), fill:v>=0?"rgba(16,223,119,.68)":"rgba(255,48,55,.72)"}));
    });
    const line = arr => arr.map((v,i)=>`${i/Math.max(arr.length-1,1)*w},${y(v)}`).join(" ");
    svg.appendChild(svgEl("polyline", {points:line(m), fill:"none", stroke:"#10df77", "stroke-width":2.4, "stroke-linecap":"round", "stroke-linejoin":"round"}));
    svg.appendChild(svgEl("polyline", {points:line(s), fill:"none", stroke:"#ff3037", "stroke-width":2.0, "stroke-linecap":"round", "stroke-linejoin":"round"}));

    scale.innerHTML = `<span style="top:0%">200,0</span><span style="top:50%">0,0</span><span style="top:100%">-200,0</span>
      <span class="osc-current" style="top:18%">${fmt(lastM,1)}</span>
      <span class="osc-current red" style="top:38%">${fmt(lastS,1)}</span>
      <span class="osc-current yellow" style="top:58%">${fmt(lastH,1)}</span>`;
  }

  function renderAll(reason="loop"){
    const all = candles();
    if(!all.length) return;

    // clamp offset after fresh data
    const maxOffset = Math.max(0, all.length - state.minBars);
    state.offset = Math.max(0, Math.min(state.offset, maxOffset));

    const view = visibleCandles();
    const range = rangeFrom(view);
    const key = `${all.length}:${state.offset}:${state.visibleBars}:${view[view.length-1]?.close}:${state.indicators.RSI}:${state.indicators.MACD}`;
    if(key === state.lastRenderKey && reason === "loop") return;
    state.lastRenderKey = key;

    setOHLC(view);
    setTimeScale(view);
    renderPriceScale(view, range);
    renderCandles(view, range);
    renderRSI(all, view);
    renderMACD(all);

    document.dispatchEvent(new CustomEvent("dvl:chart-engine-render", {
      bubbles:true,
      detail:{ reason, bars:view.length, offset:state.offset, visibleBars:state.visibleBars }
    }));

    if(typeof window.DVL_RENDER_PAPER === "function") {
      try{ window.DVL_RENDER_PAPER(); }catch(e){}
    }
    if(typeof window.DVL_RENDER_PENDING === "function") {
      try{ window.DVL_RENDER_PENDING(); }catch(e){}
    }
  }

  async function restPoll(){
    const a = api();
    if(!a.symbol || !a.interval) return;
    if(Date.now() - state.lastPollAt < 6500) return;
    state.lastPollAt = Date.now();

    try{
      const url = `${REST}/fapi/v1/klines?symbol=${encodeURIComponent(a.symbol)}&interval=${encodeURIComponent(a.interval)}&limit=140`;
      const res = await fetch(url,{cache:"no-store"});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const raw = await res.json();
      a.candles = raw.map(k=>({
        t:Number(k[0]), open:Number(k[1]), high:Number(k[2]), low:Number(k[3]), close:Number(k[4]), volume:Number(k[5]), closed:true
      }));
      state.lastWsMoveAt = Date.now();
      renderAll("rest-poll");
    }catch(err){
      $("dvlChartPlot")?.classList.add("is-offline");
      console.warn("[DVL 0.728] REST poll failed:", err);
    }
  }

  function wireInteraction(){
    const plot = $("dvlChartPlot");
    if(!plot) return;

    const pointers = new Map();
    let lastX = null;
    let startDistance = null;
    let startBars = state.visibleBars;

    function distance(){
      const pts=[...pointers.values()];
      if(pts.length < 2) return 0;
      return Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    }

    plot.addEventListener("pointerdown", ev=>{
      pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
      plot.setPointerCapture?.(ev.pointerId);
      plot.classList.add("is-panning");
      if(pointers.size === 1) lastX = ev.clientX;
      if(pointers.size === 2){
        startDistance = distance();
        startBars = state.visibleBars;
      }
    });

    plot.addEventListener("pointermove", ev=>{
      if(!pointers.has(ev.pointerId)) return;
      ev.preventDefault();
      pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});

      if(pointers.size >= 2 && startDistance){
        const d = distance();
        const ratio = startDistance / Math.max(10,d);
        state.visibleBars = Math.round(Math.max(state.minBars, Math.min(state.maxBars, startBars * ratio)));
        renderAll("pinch");
        return;
      }

      if(pointers.size === 1 && lastX !== null){
        const dx = ev.clientX - lastX;
        const stepPx = plot.clientWidth / Math.max(state.visibleBars,1);
        if(Math.abs(dx) >= Math.max(6, stepPx*.65)){
          const bars = Math.round(dx / Math.max(1, stepPx));
          state.offset = Math.max(0, state.offset + bars);
          lastX = ev.clientX;
          renderAll("pan");
        }
      }
    }, {passive:false});

    function end(ev){
      pointers.delete(ev.pointerId);
      plot.releasePointerCapture?.(ev.pointerId);
      if(!pointers.size){
        plot.classList.remove("is-panning");
        lastX = null;
        startDistance = null;
      }
    }
    plot.addEventListener("pointerup", end);
    plot.addEventListener("pointercancel", end);

    plot.addEventListener("wheel", ev=>{
      ev.preventDefault();
      const delta = ev.deltaY > 0 ? 4 : -4;
      state.visibleBars = Math.round(Math.max(state.minBars, Math.min(state.maxBars, state.visibleBars + delta)));
      renderAll("wheel-zoom");
    }, {passive:false});
  }

  function wireIndicatorActions(){
    // DVL 0.728: oscillator dropdown handling moved to DVL_OSCILLATOR_LAYOUT_MANAGER_0722
    // to avoid double toggles and to resize the chart when oscillators are removed.
  }

  function boot(){
    wireInteraction();
    wireIndicatorActions();

    document.addEventListener("dvl:market-render", () => {
      state.lastWsMoveAt = Date.now();
      renderAll("api-event");
    });

    document.addEventListener("dvl:symbol-change", () => {
      state.offset = 0;
      state.visibleBars = 58;
      setTimeout(()=>renderAll("symbol-change"), 80);
    });

    document.addEventListener("dvl:timeframe-change", () => {
      state.offset = 0;
      state.visibleBars = 58;
      setTimeout(()=>renderAll("tf-change"), 120);
    });
