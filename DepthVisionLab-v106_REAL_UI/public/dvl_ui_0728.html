    setInterval(()=>renderAll("loop"), 1000);
    setInterval(()=>restPoll(), 7000);

    setTimeout(()=>renderAll("boot"), 500);
  }

  window.DVL_RENDER_INTERACTIVE_CHART = renderAll;

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>


<script id="DVL_OSCILLATOR_LAYOUT_MANAGER_0722">
/*
  DVL Beta 0.728 — MODULE: Oscillator Layout Manager
  - Single source of truth for RSI/MACD ON/OFF.
  - Updates DVL_CHART_ENGINE.indicators.
  - Recalculates separated section positions.
  - Expands chart height when oscillators are removed.
*/
(function(){
  "use strict";

  const $ = id => document.getElementById(id);

  const BASE = {
    chartY:197,
    navY:1406,
    rsiH:222,
    macdH:218,
    plotY:58,
    timeH:58,
    chartBottomPad:40
  };

  const storeKey = "DVL_OSC_STATE_0722";
  function load(){
    try{
      return Object.assign({RSI:true, MACD:true}, JSON.parse(localStorage.getItem(storeKey) || "{}"));
    }catch(e){ return {RSI:true, MACD:true}; }
  }

  const manager = window.DVL_OSCILLATORS = {
    version:"0.728",
    state:load(),
    apply,
    toggle,
    set
  };

  function save(){
    try{ localStorage.setItem(storeKey, JSON.stringify(manager.state)); }catch(e){}
  }

  function setVar(name, value){
    const stage = $("dvlStage");
    if(stage) stage.style.setProperty(name, String(value));
  }

  function syncEngine(){
    if(window.DVL_CHART_ENGINE?.indicators){
      window.DVL_CHART_ENGINE.indicators.RSI = !!manager.state.RSI;
      window.DVL_CHART_ENGINE.indicators.MACD = !!manager.state.MACD;
    }
  }

  function apply(reason="apply"){
    const stage = $("dvlStage");
    if(!stage) return;

    const rsiOn = !!manager.state.RSI;
    const macdOn = !!manager.state.MACD;

    stage.classList.toggle("osc-rsi-off", !rsiOn);
    stage.classList.toggle("osc-macd-off", !macdOn);
    stage.classList.toggle("osc-expanded", !(rsiOn && macdOn));

    const visibleOscH = (rsiOn ? BASE.rsiH : 0) + (macdOn ? BASE.macdH : 0);
    const available = BASE.navY - BASE.chartY;
    const chartH = Math.max(640, available - visibleOscH);

    const plotH = Math.max(420, chartH - BASE.plotY - BASE.timeH - BASE.chartBottomPad);
    const timeY = BASE.plotY + plotH;

    setVar("--chart-h", chartH);
    setVar("--plot-h", plotH);
    setVar("--price-h", plotH);
    setVar("--time-y", timeY);
    setVar("--volume-h", Math.max(86, Math.min(132, Math.round(plotH * 0.19))));

    let nextY = BASE.chartY + chartH;
    if(rsiOn){
      setVar("--rsi-y", nextY);
      nextY += BASE.rsiH;
    }
    if(macdOn){
      setVar("--macd-y", nextY);
      nextY += BASE.macdH;
    }

    syncEngine();

    if(typeof window.DVL_RENDER_INTERACTIVE_CHART === "function"){
      setTimeout(()=>window.DVL_RENDER_INTERACTIVE_CHART("osc-layout-" + reason), 30);
    }
    if(typeof window.DVL_RENDER_PAPER === "function"){
      setTimeout(()=>window.DVL_RENDER_PAPER(), 45);
    }
    if(typeof window.DVL_RENDER_PENDING === "function"){
      setTimeout(()=>window.DVL_RENDER_PENDING(), 45);
    }

    document.dispatchEvent(new CustomEvent("dvl:oscillator-layout-change", {
      bubbles:true,
      detail:{...manager.state, chartH, plotH, reason}
    }));
  }

  function set(name, value){
    if(name !== "RSI" && name !== "MACD") return;
    manager.state[name] = !!value;
    save();
    apply("set-" + name.toLowerCase());
  }

  function toggle(name){
    if(name !== "RSI" && name !== "MACD") return;
    manager.state[name] = !manager.state[name];
    save();
    apply("toggle-" + name.toLowerCase());
  }

  document.addEventListener("dvl:dropdown-action", ev=>{
    if(ev.detail?.title !== "Indicadores") return;
    const action = ev.detail?.action;
    if(action === "rsi") toggle("RSI");
    if(action === "macd") toggle("MACD");
  });

  // Safety: when API/chart engine boots after this module, keep states synced.
  const syncTimer = setInterval(()=>{
    syncEngine();
  }, 1000);

  window.addEventListener("beforeunload", ()=>clearInterval(syncTimer));

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", ()=>apply("boot"));
  }else{
    apply("boot");
  }
})();
</script>


<script id="DVL_PANE_ZOOM_SPLITTERS_0723">
(function(){
  "use strict";

  const $ = id => document.getElementById(id);
  const BASE = { chartY:197, navY:1406, plotY:58, timeH:58, bottomPad:40 };
  const MIN = { chartH:560, oscH:138, plotH:350 };
  const DEFAULT = { chartH:758, rsiH:222, macdH:218 };

  function load(){
    try{ return JSON.parse(localStorage.getItem("DVL_PANES_0723") || "{}"); }
    catch(e){ return {}; }
  }

  const state = window.DVL_PANES = Object.assign({
    version:"0.728",
    chartH:DEFAULT.chartH,
    rsiH:DEFAULT.rsiH,
    macdH:DEFAULT.macdH,
    rsiOn:true,
    macdOn:true,
    rsiZoom:1,
    rsiOffset:0,
    macdZoom:1,
    macdOffset:0,
    drag:null
  }, load());

  function save(){
    try{
      localStorage.setItem("DVL_PANES_0723", JSON.stringify({
        chartH:state.chartH,
        rsiH:state.rsiH,
        macdH:state.macdH,
        rsiZoom:state.rsiZoom,
        rsiOffset:state.rsiOffset,
        macdZoom:state.macdZoom,
        macdOffset:state.macdOffset
      }));
    }catch(e){}
  }

  function setVar(name, value){
    $("dvlStage")?.style.setProperty(name, String(Math.round(value)));
  }

  function oscState(){
    const osc = window.DVL_OSCILLATORS?.state;
    state.rsiOn = osc ? !!osc.RSI : state.rsiOn;
    state.macdOn = osc ? !!osc.MACD : state.macdOn;
  }

  function availableHeight(){ return BASE.navY - BASE.chartY; }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  function normalizeHeights(){
    oscState();

    if(!state.rsiOn && !state.macdOn){
      state.chartH = availableHeight();
      return;
    }

    if(state.rsiOn) state.rsiH = clamp(state.rsiH || DEFAULT.rsiH, MIN.oscH, 430);
    if(state.macdOn) state.macdH = clamp(state.macdH || DEFAULT.macdH, MIN.oscH, 430);

    let visibleOsc = (state.rsiOn ? state.rsiH : 0) + (state.macdOn ? state.macdH : 0);
    state.chartH = clamp(state.chartH || DEFAULT.chartH, MIN.chartH, availableHeight() - MIN.oscH);

    let total = state.chartH + visibleOsc;
    if(total > availableHeight()){
      const overflow = total - availableHeight();
      if(state.rsiOn && state.macdOn){
        const rShare = state.rsiH / (state.rsiH + state.macdH);
        state.rsiH = clamp(state.rsiH - overflow*rShare, MIN.oscH, 430);
        state.macdH = clamp(state.macdH - overflow*(1-rShare), MIN.oscH, 430);
      }else if(state.rsiOn){
        state.rsiH = clamp(state.rsiH - overflow, MIN.oscH, 430);
      }else if(state.macdOn){
        state.macdH = clamp(state.macdH - overflow, MIN.oscH, 430);
      }
    }

    total = state.chartH + (state.rsiOn ? state.rsiH : 0) + (state.macdOn ? state.macdH : 0);
    if(total < availableHeight()) state.chartH += availableHeight() - total;
  }

  function apply(reason="apply"){
    normalizeHeights();

    const stage = $("dvlStage");
    if(stage){
      stage.classList.toggle("osc-rsi-off", !state.rsiOn);
      stage.classList.toggle("osc-macd-off", !state.macdOn);
      stage.classList.toggle("osc-expanded", !(state.rsiOn && state.macdOn));
    }

    const plotH = Math.max(MIN.plotH, state.chartH - BASE.plotY - BASE.timeH - BASE.bottomPad);
    const timeY = BASE.plotY + plotH;

    setVar("--chart-h", state.chartH);
    setVar("--plot-h", plotH);
    setVar("--price-h", plotH);
    setVar("--time-y", timeY);
    setVar("--volume-h", clamp(plotH * .19, 76, 132));

    let y = BASE.chartY + state.chartH;
    if(state.rsiOn){
      setVar("--rsi-y", y);
      setVar("--rsi-h", state.rsiH);
      y += state.rsiH;
    }
    if(state.macdOn){
      setVar("--macd-y", y);
      setVar("--macd-h", state.macdH);
      y += state.macdH;
    }

    save();

    if(typeof window.DVL_RENDER_INTERACTIVE_CHART === "function"){
      setTimeout(()=>window.DVL_RENDER_INTERACTIVE_CHART("pane-" + reason), 20);
    }
    if(typeof window.DVL_RENDER_PAPER === "function") setTimeout(()=>window.DVL_RENDER_PAPER(), 35);
    if(typeof window.DVL_RENDER_PENDING === "function") setTimeout(()=>window.DVL_RENDER_PENDING(), 35);

    document.dispatchEvent(new CustomEvent("dvl:pane-layout-change", {
      bubbles:true,
      detail:{...state, plotH, reason}
    }));
  }

  function startDividerDrag(ev, type){
    ev.preventDefault();
    ev.stopPropagation();
    state.drag = {
      type,
      y:ev.clientY,
      chartH:state.chartH,
      rsiH:state.rsiH,
      macdH:state.macdH
    };
    ev.currentTarget.classList.add("is-dragging");
    ev.currentTarget.setPointerCapture?.(ev.pointerId);
  }

  function moveDivider(ev){
    if(!state.drag || (state.drag.type !== "chart-rsi" && state.drag.type !== "rsi-macd")) return;
    ev.preventDefault();

    const px = ($("dvlStage")?.clientWidth || 864) / 864;
    const dy = (ev.clientY - state.drag.y) / Math.max(.1, px);

    if(state.drag.type === "chart-rsi"){
      state.chartH = clamp(state.drag.chartH + dy, MIN.chartH, availableHeight() - MIN.oscH);
      const delta = state.chartH - state.drag.chartH;
      if(state.rsiOn) state.rsiH = clamp(state.drag.rsiH - delta, MIN.oscH, 430);
      else if(state.macdOn) state.macdH = clamp(state.drag.macdH - delta, MIN.oscH, 430);
    }

    if(state.drag.type === "rsi-macd" && state.rsiOn && state.macdOn){
      state.rsiH = clamp(state.drag.rsiH + dy, MIN.oscH, 430);
      state.macdH = clamp(state.drag.macdH - dy, MIN.oscH, 430);
    }

    apply("divider-drag");
  }

  function endDivider(){
    if(!state.drag) return;
    document.querySelectorAll(".dvl-pane-divider.is-dragging").forEach(x=>x.classList.remove("is-dragging"));
    state.drag = null;
    save();
  }

  function wireDividers(){
    $("dvlChartRsiDivider")?.addEventListener("pointerdown", ev=>startDividerDrag(ev,"chart-rsi"), {passive:false});
    $("dvlRsiMacdDivider")?.addEventListener("pointerdown", ev=>startDividerDrag(ev,"rsi-macd"), {passive:false});
    document.addEventListener("pointermove", moveDivider, {passive:false});
    document.addEventListener("pointerup", endDivider, {passive:false});
    document.addEventListener("pointercancel", endDivider, {passive:false});
  }

  function ensureHud(sec){
    if(!sec) return null;
    let hud = sec.querySelector(".dvl-osc-mini-hud");
    if(!hud){
      hud = document.createElement("div");
      hud.className = "dvl-osc-mini-hud";
      sec.appendChild(hud);
    }
    return hud;
  }

  function showHud(name){
    const sec = name === "RSI" ? $("dvlRSISection") : $("dvlMACDSection");
    const hud = ensureHud(sec);
    if(!sec || !hud) return;
    const zoom = name === "RSI" ? state.rsiZoom : state.macdZoom;
    const off = name === "RSI" ? state.rsiOffset : state.macdOffset;
    hud.textContent = `Z ${zoom.toFixed(2)} / ${off.toFixed(0)}`;
    sec.classList.add("show-osc-hud");
    clearTimeout(sec._hudTimer);
    sec._hudTimer = setTimeout(()=>sec.classList.remove("show-osc-hud"), 650);
  }

  function applyOscTransform(name){
    const svg = name === "RSI" ? $("dvlRSISvg") : $("dvlMACDSvg");
    if(!svg) return;
    const zoom = name === "RSI" ? state.rsiZoom : state.macdZoom;
    const off = name === "RSI" ? state.rsiOffset : state.macdOffset;
    svg.style.transform = `translateY(${off}px) scaleY(${zoom})`;
    svg.style.transformOrigin = "50% 50%";
    showHud(name);
    save();
  }

  function wireOscillatorZoom(name, plotId){
    const plot = $(plotId);
    if(!plot) return;

    const pointers = new Map();
    let startY = null;
    let startOffset = 0;
    let startDistance = 0;
    let startZoom = 1;

    function getZoom(){ return name === "RSI" ? state.rsiZoom : state.macdZoom; }
    function setZoom(v){ if(name === "RSI") state.rsiZoom = v; else state.macdZoom = v; }
    function getOffset(){ return name === "RSI" ? state.rsiOffset : state.macdOffset; }
    function setOffset(v){ if(name === "RSI") state.rsiOffset = v; else state.macdOffset = v; }

    function distance(){
      const pts = [...pointers.values()];
      if(pts.length < 2) return 0;
      return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
    }

    plot.addEventListener("wheel", ev=>{
      ev.preventDefault();
      setZoom(clamp(getZoom() + (ev.deltaY < 0 ? .08 : -.08), .45, 3.2));
      applyOscTransform(name);
    }, {passive:false});

    plot.addEventListener("pointerdown", ev=>{
      ev.preventDefault();
      pointers.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
      plot.setPointerCapture?.(ev.pointerId);
      plot.classList.add("is-osc-dragging");
      startY = ev.clientY;
      startOffset = getOffset();
      if(pointers.size === 2){
        startDistance = distance();
        startZoom = getZoom();
      }
    }, {passive:false});

    plot.addEventListener("pointermove", ev=>{
      if(!pointers.has(ev.pointerId)) return;
      ev.preventDefault();
      pointers.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});

      if(pointers.size >= 2 && startDistance){
        setZoom(clamp(startZoom * (distance()/Math.max(10,startDistance)), .45, 3.2));
        applyOscTransform(name);
        return;
      }

      if(pointers.size === 1 && startY !== null){
        setOffset(startOffset + (ev.clientY - startY));
        applyOscTransform(name);
      }
    }, {passive:false});

    function end(ev){
      pointers.delete(ev.pointerId);
      plot.releasePointerCapture?.(ev.pointerId);
      if(!pointers.size){
        plot.classList.remove("is-osc-dragging");
        startY = null;
        startDistance = 0;
        save();
      }
    }
    plot.addEventListener("pointerup", end);
    plot.addEventListener("pointercancel", end);

    let lastTap = 0;
    plot.addEventListener("click", ()=>{
      const now = Date.now();
      if(now - lastTap < 280){
        setZoom(1);
        setOffset(0);
        applyOscTransform(name);
      }
      lastTap = now;
    });
  }

  function boot(){
    wireDividers();
    wireOscillatorZoom("RSI", "dvlRSIPlot");
    wireOscillatorZoom("MACD", "dvlMACDPlot");

    document.addEventListener("dvl:chart-engine-render", ()=>{
      applyOscTransform("RSI");
      applyOscTransform("MACD");
    });

    document.addEventListener("dvl:oscillator-layout-change", ()=>{
      oscState();
      apply("osc-manager-sync");
    });

    setTimeout(()=>apply("boot"), 70);
  }

  window.DVL_APPLY_PANE_LAYOUT = apply;
  window.DVL_RESET_PANES = function(){
    state.chartH = DEFAULT.chartH;
    state.rsiH = DEFAULT.rsiH;
    state.macdH = DEFAULT.macdH;
    state.rsiZoom = 1;
    state.rsiOffset = 0;
    state.macdZoom = 1;
    state.macdOffset = 0;
    save();
    apply("reset");
    applyOscTransform("RSI");
    applyOscTransform("MACD");
  };

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>


<script id="DVL_LIGHT_LABEL_TIMER_PATCH_0726">
/*
  DVL Beta 0.728 — Light Label + Timer Patch
  Purpose: fix small visual issues without touching the smooth chart engine.
  - Hides price scale labels that collide with the current price pill.
  - Prevents top/bottom scale labels from being clipped.
  - Replaces current price label small text with candle close countdown.
*/
(function(){
  "use strict";

  const $ = id => document.getElementById(id);

  function api(){
    return window.DVL_API || {};
  }

  function candles(){
    const c = api().candles;
    return Array.isArray(c) ? c : [];
  }

  function intervalMs(){
    const iv = String(api().interval || "5m");
    const m = iv.match(/^(\d+)([smhdwM])$/);
    if(!m) return 5 * 60 * 1000;
    const n = Number(m[1]);
    const u = m[2];
    if(u === "s") return n * 1000;
    if(u === "m") return n * 60 * 1000;
    if(u === "h") return n * 60 * 60 * 1000;
    if(u === "d") return n * 24 * 60 * 60 * 1000;
    if(u === "w") return n * 7 * 24 * 60 * 60 * 1000;
    if(u === "M") return n * 30 * 24 * 60 * 60 * 1000;
    return 5 * 60 * 1000;
  }

  function timerText(){
    const data = candles();
    const last = data[data.length - 1];
    const open = Number(last?.t);
    const dur = intervalMs();
    if(!Number.isFinite(open) || !dur) return "--:--";

    let left = open + dur - Date.now();
    if(left < 0) left = dur - ((Date.now() - open) % dur);
    left = Math.max(0, left);

    const total = Math.floor(left / 1000);
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    if(h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }

  function parseTopPercent(el){
    const raw = String(el.style.top || "");
    if(raw.endsWith("%")) return Number(raw.slice(0,-1));
    return NaN;
  }

  function patchPriceScale(){
    const scale = $("dvlPriceScale");
    if(!scale) return;

    const pill = scale.querySelector(".price-pill.green, .price-pill.dvl-scale-current");
    if(!pill) return;

    let pillTop = parseTopPercent(pill);
    if(Number.isFinite(pillTop)){
      const clamped = Math.max(4.5, Math.min(95.5, pillTop));
      if(Math.abs(clamped - pillTop) > 0.1) pill.style.top = `${clamped}%`;
      pillTop = clamped;
    }

    const small = pill.querySelector("small");
    if(small) small.textContent = timerText();

    scale.querySelectorAll(".scale-label").forEach(label => {
      label.classList.remove("dvl-hide-near-current","dvl-edge-top","dvl-edge-bottom");
      const top = parseTopPercent(label);
      if(!Number.isFinite(top)) return;

      if(top <= 1.5) label.classList.add("dvl-edge-top");
      if(top >= 98.5) label.classList.add("dvl-edge-bottom");

      if(Number.isFinite(pillTop) && Math.abs(top - pillTop) < 7.25){
        label.classList.add("dvl-hide-near-current");
      }
    });
  }

  function run(){
    patchPriceScale();
  }

  document.addEventListener("dvl:chart-engine-render", run);
  document.addEventListener("dvl:market-render", run);
  document.addEventListener("dvl:pane-layout-change", run);
  document.addEventListener("dvl:oscillator-layout-change", run);
  document.addEventListener("dvl:timeframe-change", () => setTimeout(run, 120));
  document.addEventListener("dvl:symbol-change", () => setTimeout(run, 120));

  setInterval(run, 1000);
  setTimeout(run, 400);

  window.DVL_LIGHT_LABEL_PATCH = { version:"0.728", run };
})();
</script>


<script id="DVL_COMPACT_CHART_GAP_0727">
/*
  DVL Beta 0.728 — Compact Chart Gap
  Purpose: reduce empty vertical space between chart time scale and oscillators.
  Does not rewrite candles, RSI, MACD, API, paper trading, or pane engines.
*/
(function(){
  "use strict";

  const $ = id => document.getElementById(id);

  function numVar(name, fallback){
    const stage = $("dvlStage");
    const raw = stage ? getComputedStyle(stage).getPropertyValue(name) : "";
    const n = parseFloat(raw);
    return Number.isFinite(n) ? n : fallback;
  }

  function setVar(name, value){
    const stage = $("dvlStage");
    if(stage) stage.style.setProperty(name, String(Math.round(value)));
  }

  function apply(reason="apply"){
    const panes = window.DVL_PANES;
    const chartH = Number(panes?.chartH) || numVar("--chart-h", 758);
    const plotY = numVar("--plot-y", 58);

    // Old visual had a large bottom reserve. This keeps time readable but gives
    // more height back to the candle plot and pulls oscillators closer.
    const timeH = 42;
    const bottomPad = 8;
    const plotH = Math.max(360, chartH - plotY - timeH - bottomPad);
    const timeY = plotY + plotH;

    setVar("--time-h", timeH);
    setVar("--plot-h", plotH);
    setVar("--price-h", plotH);
    setVar("--time-y", timeY);

    const volumeH = Math.max(72, Math.min(124, plotH * 0.18));
    setVar("--volume-h", volumeH);

    document.dispatchEvent(new CustomEvent("dvl:compact-gap-apply", {
      bubbles:true,
      detail:{ reason, chartH, plotH, timeY, timeH }
    }));

    if(typeof window.DVL_LIGHT_LABEL_PATCH?.run === "function"){
      setTimeout(()=>window.DVL_LIGHT_LABEL_PATCH.run(), 30);
    }
    if(typeof window.DVL_RENDER_PAPER === "function"){
      setTimeout(()=>window.DVL_RENDER_PAPER(), 35);
    }
    if(typeof window.DVL_RENDER_PENDING === "function"){
      setTimeout(()=>window.DVL_RENDER_PENDING(), 35);
    }
  }

  document.addEventListener("dvl:pane-layout-change", () => setTimeout(()=>apply("pane"), 20));
  document.addEventListener("dvl:oscillator-layout-change", () => setTimeout(()=>apply("osc"), 20));
  document.addEventListener("dvl:chart-engine-render", () => setTimeout(()=>apply("chart"), 20));
  document.addEventListener("dvl:market-render", () => setTimeout(()=>apply("market"), 20));
  document.addEventListener("dvl:timeframe-change", () => setTimeout(()=>apply("tf"), 120));
  document.addEventListener("dvl:symbol-change", () => setTimeout(()=>apply("symbol"), 120));

  window.DVL_APPLY_COMPACT_GAP = apply;

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", () => setTimeout(()=>apply("boot"), 250));
  else setTimeout(()=>apply("boot"), 250);
})();
</script>


<script id="DVL_PRICE_SCALE_ZOOM_0728">
/*
  DVL Beta 0.728 — Price Scale Zoom/Pan
  Light, isolated behavior:
  - Wheel/scroll on right price scale = vertical zoom.
  - Drag on right price scale = vertical pan.
  - Double tap/click on scale = reset.
  Does not replace chart renderer.
*/
(function(){
  "use strict";

  const $ = id => document.getElementById(id);
  const STORE = "DVL_PRICE_SCALE_0728";

  function load(){
    try{return JSON.parse(localStorage.getItem(STORE) || "{}");}
    catch(e){return {};}
  }

  const state = window.DVL_PRICE_SCALE_0728 = Object.assign({
    version:"0.728",
    zoom:1,
    offset:0,
    lastRange:null,
    lastRawRange:null
  }, load());

  function save(){
    try{
      localStorage.setItem(STORE, JSON.stringify({
        zoom:state.zoom,
        offset:state.offset
      }));
    }catch(e){}
  }

  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  function render(reason="price-scale"){
    if(typeof window.DVL_RENDER_INTERACTIVE_CHART === "function"){
      window.DVL_RENDER_INTERACTIVE_CHART(reason);
    }
    if(typeof window.DVL_LIGHT_LABEL_PATCH?.run === "function"){
      setTimeout(()=>window.DVL_LIGHT_LABEL_PATCH.run(), 35);
    }
    if(typeof window.DVL_APPLY_COMPACT_GAP === "function"){
      setTimeout(()=>window.DVL_APPLY_COMPACT_GAP("price-scale"), 40);
    }
    if(typeof window.DVL_RENDER_PAPER === "function") setTimeout(()=>window.DVL_RENDER_PAPER(), 45);
    if(typeof window.DVL_RENDER_PENDING === "function") setTimeout(()=>window.DVL_RENDER_PENDING(), 45);
  }

  function hud(){
    const scale = $("dvlPriceScale");
    if(!scale) return;
    let h = scale.querySelector(".dvl-scale-hud");
    if(!h){
      h = document.createElement("div");
      h.className = "dvl-scale-hud";
      scale.appendChild(h);
    }
    h.textContent = `Z ${Number(state.zoom).toFixed(2)}`;
    scale.classList.add("show-scale-hud");
    clearTimeout(scale._scaleHudTimer);
    scale._scaleHudTimer = setTimeout(()=>scale.classList.remove("show-scale-hud"), 650);
  }

  function wire(){
    const scale = $("dvlPriceScale");
    if(!scale) return;

    let dragging = false;
    let pointerId = null;
    let startY = 0;
    let startOffset = 0;
    let startSpan = 0;
    let lastTap = 0;

    scale.addEventListener("wheel", ev=>{
      ev.preventDefault();
      ev.stopPropagation();

      const before = state.zoom;
      const delta = ev.deltaY < 0 ? .10 : -.10;
      state.zoom = clamp((Number(state.zoom)||1) + delta, .45, 8);

      // Keep offset stable; rangeFrom will apply zoom on next render.
      if(Math.abs(state.zoom - before) > .001){
        save();
        scale.classList.add("is-scale-zooming");
        clearTimeout(scale._scaleZoomTimer);
        scale._scaleZoomTimer = setTimeout(()=>scale.classList.remove("is-scale-zooming"), 260);
        hud();
        render("price-scale-wheel");
      }
    }, {passive:false});

    scale.addEventListener("pointerdown", ev=>{
      ev.preventDefault();
      ev.stopPropagation();
      dragging = true;
      pointerId = ev.pointerId;
      startY = ev.clientY;
      startOffset = Number(state.offset)||0;
      const r = state.lastRange || state.lastRawRange || {min:0,max:1};
      startSpan = Math.max(1e-9, Number(r.max) - Number(r.min));
      scale.setPointerCapture?.(pointerId);
      scale.classList.add("is-scale-dragging");
      hud();
    }, {passive:false});

    scale.addEventListener("pointermove", ev=>{
      if(!dragging || ev.pointerId !== pointerId) return;
      ev.preventDefault();
      ev.stopPropagation();

      const height = scale.clientHeight || 520;
      const dy = ev.clientY - startY;

      // Drag down = move visible price range upward/downward naturally with finger.
      state.offset = startOffset + dy * (startSpan / height);
      save();
      hud();
      render("price-scale-drag");
    }, {passive:false});

    function end(ev){
      if(pointerId !== null && ev.pointerId !== pointerId) return;
      dragging = false;
      pointerId = null;
      scale.classList.remove("is-scale-dragging");
      save();
    }

    scale.addEventListener("pointerup", end);
    scale.addEventListener("pointercancel", end);

    scale.addEventListener("click", ev=>{
      const now = Date.now();
      if(now - lastTap < 280){
        ev.preventDefault();
        ev.stopPropagation();
        state.zoom = 1;
        state.offset = 0;
        save();
        hud();
        render("price-scale-reset");
      }
      lastTap = now;
    }, true);

    // Re-apply after normal chart renders so state.lastRange is always fresh.
    document.addEventListener("dvl:chart-engine-render", () => {
      if(typeof window.DVL_LIGHT_LABEL_PATCH?.run === "function") {
        setTimeout(()=>window.DVL_LIGHT_LABEL_PATCH.run(), 20);
      }
    });

    window.DVL_RESET_PRICE_SCALE = function(){
      state.zoom = 1;
      state.offset = 0;
      save();
      render("price-scale-reset-global");
    };

    // First render after module exists so patched rangeFrom sees the state object.
    setTimeout(()=>render("price-scale-boot"), 250);
  }

  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", wire);
  else wire();
})();
</script>


<script id="DVL_UI_OVERLAY_PHASE_1_IFRAME_BRIDGE">
/* Phase 1 bridge (iframe side): forwards SAFE control clicks to the host app.
   Visual-only design otherwise runs unchanged. */
(function(){
  "use strict";
  function send(type, payload){
    try{ parent.postMessage({ __dvlOverlayPhase1:true, type:type, payload:payload }, "*"); }catch(_e){}
  }
  function on(id, fn){ var el=document.getElementById(id); if(el) el.addEventListener("click", fn, false); }
  on("profileSaveBtn",     function(){ send("save"); });
  on("currentFavoriteBtn", function(){ send("favorite"); });
  on("symbolBtn",          function(){ send("assetClick"); }); /* Phase 2 on host side */
  /* Delegated: timeframe options/buttons are generated at runtime by the design. */
  document.addEventListener("click", function(e){
    var t = e.target;
    var opt = (t && t.closest) ? t.closest("[data-timeframe]") : null;
    if(opt){ send("timeframe", opt.getAttribute("data-timeframe")); }
  }, true);
})();
</script>
